# Netlify deployment config for the HR Intelligence Platform.
# Static frontend is served from public/; all /api/* calls run in a serverless
# function that hosts the Express app.

[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'no build step'"

[build.environment]
  NODE_VERSION = "18"
  # Serverless functions can only write to the OS temp dir. Point runtime data
  # there so auth/upload persistence works after deploy (login also has an
  # in-memory bootstrap so it works even if this is unset or read-only).
  HR_DATA_DIR = "/tmp/maysan-hr-data"

[functions]
  node_bundler = "esbuild"
  # Ship the demo seed so dashboards/movements show data on the live link.
  included_files = ["data/seed/**", "public/index.html"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback (the app uses hash routing, so this only covers deep links).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
