<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="MAYSAN INT. GROUP">
  <defs>
    <linearGradient id="mgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B4D2E"/>
      <stop offset=".55" stop-color="#137a45"/>
      <stop offset="1" stop-color="#1E9E48"/>
    </linearGradient>
    <linearGradient id="mgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Serif MG monogram: M teal->green, G bright green -->
  <g font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="330" text-anchor="middle">
    <text x="205" y="240" fill="url(#mgM)">M</text>
    <text x="470" y="240" fill="url(#mgG)">G</text>
  </g>
  <!-- Wordmark across the centre -->
  <g font-family="'Tajawal','Segoe UI',Arial,sans-serif" font-weight="800" font-size="33" letter-spacing="7" text-anchor="middle">
    <text x="200" y="150" fill="#12726e">MAYSAN</text>
    <text x="356" y="150" fill="#0B4D2E">INT.</text>
    <text x="486" y="150" fill="#1E9E48">GROUP</text>
  </g>
</svg>
