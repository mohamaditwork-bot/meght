<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="MAYSAN INT. GROUP">
  <defs>
    <linearGradient id="mgTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3f42"/>
      <stop offset="1" stop-color="#137a5e"/>
    </linearGradient>
    <linearGradient id="mgGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f9d47"/>
      <stop offset="1" stop-color="#2ecc57"/>
    </linearGradient>
  </defs>
  <!-- Large serif MG monogram (M teal->green, G green), overlapping -->
  <g font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="300" text-anchor="middle">
    <text x="238" y="232" fill="url(#mgTeal)">M</text>
    <text x="430" y="232" fill="url(#mgGreen)">G</text>
  </g>
  <!-- Wordmark band + text across the middle -->
  <rect x="24" y="128" width="592" height="46" rx="6" fill="#ffffff" opacity="0.82"/>
  <g font-family="'Cairo','Segoe UI',Arial,sans-serif" font-weight="800" font-size="30" letter-spacing="7" text-anchor="middle">
    <text x="188" y="162" fill="#12726e">MAYSAN</text>
    <text x="330" y="162" fill="#0a3f42">INT.</text>
    <text x="452" y="162" fill="#1f9d47">GROUP</text>
  </g>
</svg>
