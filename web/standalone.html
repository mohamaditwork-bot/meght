<title>MAYSAN HR Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* MAYSAN INT. GROUP — HR Intelligence Platform design system
   Executive / formal treatment: restrained brand palette (deep teal + one
   green accent), quiet neutrals with a slight teal bias, generous whitespace,
   hairline borders, minimal shadow. Semantic colour (ok/warn/danger) is used
   only to signal status, never for decoration. */
:root{
  /* MAYSAN green identity: deep forest -> bright green, light-green ground, gold accent. */
  --teal-900:#0B4D2E; --teal-800:#156835; --teal-700:#1E883F; --teal-600:#27A84E;
  --green-700:#156835; --green-600:#1E883F; --green-500:#27A84E; --green-400:#3CC963;
  --gold:#C49A3A;
  --brand-grad:linear-gradient(165deg,#0B4D2E 0%,#156835 100%);
  --brand-grad-soft:linear-gradient(135deg,#156835 0%,#27A84E 100%);
  --bg:#F3FAF5; --panel:#ffffff; --panel-2:#EAF7EE;
  --ink:#081C0F; --ink-2:#1F3D28; --muted:#4A6B55; --line:#C8E4D2; --line-2:#EAF7EE;
  --accent:#1E883F;
  --ok:#1E883F; --warn:#D4820F; --danger:#C0392B; --watch:#1A6EA3; --info:#156835;
  --shadow-sm:0 1px 3px rgba(8,28,15,.05);
  --shadow:0 1px 4px rgba(8,28,15,.07),0 4px 16px rgba(8,28,15,.05); --shadow-lg:0 16px 44px rgba(8,28,15,.16);
  --radius:10px; --radius-sm:8px; --sidebar-w:248px; --topbar-h:60px;
  --font:'Tajawal','Inter','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);direction:rtl;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#94a3b8;background-clip:content-box}
.hide{display:none!important}
/* inline line-icons */
.ic{width:16px;height:16px;flex:none;vertical-align:-3px}
.btn .ic,.chip-btn .ic,.period-chip .ic{width:15px;height:15px}

/* ---------- Login ---------- */
.login-wrap{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(1200px 600px at 80% -10%,rgba(46,204,87,.14),transparent),
  radial-gradient(900px 600px at 0% 110%,rgba(14,90,90,.18),transparent),#0a2225;z-index:60}
.login-card{width:min(420px,92vw);background:var(--panel);border-radius:24px;box-shadow:var(--shadow-lg);padding:38px 34px;text-align:center;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.login-logo{height:78px;margin-bottom:6px}
.login-card h1{font-size:19px;margin:8px 0 2px;color:var(--teal-800)}
.login-card p{color:var(--muted);margin:0 0 24px;font-size:13px}
.pass-field{position:relative;margin-bottom:14px}
.pass-field input{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:13px;font-size:20px;text-align:center;letter-spacing:8px;font-weight:700;color:var(--ink);transition:.2s;background:var(--panel-2)}
.pass-field input:focus{outline:none;border-color:var(--green-500);box-shadow:0 0 0 4px rgba(31,174,74,.14);background:#fff}
.btn-login{width:100%;padding:14px;border:none;border-radius:13px;background:var(--brand-grad-soft);color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;transition:.2s;box-shadow:0 8px 20px rgba(22,163,74,.28)}
.btn-login:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-login:disabled{opacity:.6;transform:none;cursor:wait}
.login-err{color:var(--danger);font-size:13px;min-height:20px;margin-top:10px;font-weight:600}
.login-foot{margin-top:22px;color:var(--muted);font-size:11.5px;letter-spacing:.4px}

/* ---------- App shell ---------- */
.app{min-height:100vh}
.sidebar{background:var(--brand-grad);color:#eaf6f2;position:fixed;top:0;right:0;bottom:0;width:var(--sidebar-w);display:flex;flex-direction:column;z-index:40;box-shadow:-4px 0 24px rgba(10,34,37,.14)}
.sidebar-head{padding:18px 20px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-head img{height:40px}
.sidebar-head .brand-name{font-weight:800;font-size:14px;line-height:1.2}
.sidebar-head .brand-sub{font-size:10px;opacity:.75;letter-spacing:1px}
.nav{flex:1;overflow-y:auto;padding:10px 12px 20px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);background-clip:content-box}
.nav-group{margin-top:14px}
.nav-group-t{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;opacity:.6;padding:6px 12px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:#dff1ec;font-size:13.5px;font-weight:600;transition:.15s;margin-bottom:2px}
.nav-item .ico{width:18px;height:18px;flex:none;opacity:.9;display:grid;place-items:center}
.nav-item .ico .ic{width:17px;height:17px}
.nav-item:hover{background:rgba(255,255,255,.1)}
.nav-item.active{background:rgba(255,255,255,.17);color:#fff;box-shadow:inset 3px 0 0 #34c759}
.nav-item .badge{margin-inline-start:auto;background:rgba(255,255,255,.22);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;opacity:.8}

/* ---------- Main ---------- */
/* In RTL the inline-start edge is on the right, where the fixed sidebar sits. */
.main{margin-inline-start:var(--sidebar-w);min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:0 22px}
.menu-btn{display:none;background:none;border:none;font-size:22px;color:var(--teal-700)}
.search-box{position:relative;flex:1;max-width:440px}
.search-box input{width:100%;padding:10px 40px 10px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--panel-2);transition:.2s}
.search-box input:focus{outline:none;border-color:var(--green-500);background:#fff;box-shadow:0 0 0 3px rgba(31,174,74,.12)}
.search-box .s-ico{position:absolute;inset-inline-end:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.suggest{position:absolute;top:calc(100% + 6px);inset-inline:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);max-height:340px;overflow:auto;z-index:50}
.suggest-item{padding:9px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.suggest-item:hover{background:var(--panel-2)}
.suggest-item .code{font-size:11px;color:var(--muted);background:var(--panel-2);border-radius:6px;padding:1px 7px;font-weight:700}
.topbar-spacer{flex:1}
.topbar-actions{display:flex;align-items:center;gap:9px}
.period-chip,.chip-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink-2);transition:.15s}
.chip-btn:hover,.period-chip:hover{border-color:var(--green-400);color:var(--teal-700)}
.quality-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;font-weight:800;font-size:12.5px;color:#fff;background:var(--green-600)}
.quality-chip.mid{background:var(--warn)} .quality-chip.low{background:var(--danger)}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 12px;border-radius:30px;border:1.5px solid var(--line);background:#fff}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--brand-grad-soft);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.user-chip .u-name{font-size:12.5px;font-weight:700;line-height:1.1}
.user-chip .u-role{font-size:10.5px;color:var(--muted)}

/* dropdown */
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-lg);min-width:230px;padding:7px;z-index:55}
.dd-menu button,.dd-menu a{display:flex;align-items:center;gap:9px;width:100%;text-align:start;padding:9px 12px;border:none;background:none;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.dd-menu button:hover,.dd-menu a:hover{background:var(--panel-2)}
.dd-menu hr{border:none;border-top:1px solid var(--line-2);margin:5px 0}

/* ---------- Filter bar ---------- */
.filterbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:var(--topbar-h);z-index:20}
.filterbar .fl{display:flex;flex-direction:column;gap:3px}
.filterbar label{font-size:10.5px;color:var(--muted);font-weight:700;padding-inline-start:2px}
.filterbar select{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:600;background:var(--panel-2);color:var(--ink-2);min-width:120px}
.filterbar select:focus{outline:none;border-color:var(--green-500)}
.filter-reset{margin-inline-start:auto;padding:8px 14px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--danger)}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 22px 0}
.active-filters .af{background:var(--teal-700);color:#fff;border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.active-filters .af b{opacity:.7;font-weight:600}
.active-filters .af span{cursor:pointer;opacity:.8}

/* ---------- Content ---------- */
.content{padding:22px;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:22px;margin:0;color:var(--teal-800);font-weight:800}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.page-head .ph-actions{display:flex;gap:9px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink-2);transition:.15s}
.btn:hover{border-color:var(--green-400);color:var(--teal-700)}
.btn-primary{background:var(--brand-grad-soft);color:#fff;border:none;box-shadow:0 6px 16px rgba(22,163,74,.24)}
.btn-primary:hover{filter:brightness(1.06);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}

/* KPI grid — uniform, quiet tiles. Colour is reserved for status, not decoration. */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;position:relative;box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s}
.kpi:hover{box-shadow:var(--shadow);border-color:#d7e0e0}
.kpi .k-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.kpi .k-label{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.2px;line-height:1.4}
.kpi .k-ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);color:var(--teal-700);border:1px solid var(--line);flex:none}
.kpi .k-ico .ic{width:16px;height:16px}
.kpi .k-val{font-size:27px;font-weight:700;color:var(--ink);margin-top:12px;letter-spacing:-.4px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .k-val .cur{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;gap:6px;align-items:center}
.kpi .k-delta{font-weight:700;font-size:11.5px}
.kpi .up{color:var(--ok)} .kpi .down{color:var(--danger)}
/* Semantic accents only: alert tiles get a quiet status tint on the icon. */
.kpi.accent-red .k-ico{color:var(--danger);background:rgba(192,57,43,.07);border-color:rgba(192,57,43,.18)}
.kpi.accent-amber .k-ico{color:var(--warn);background:rgba(183,121,31,.08);border-color:rgba(183,121,31,.18)}
.kpi.accent-green .k-ico{color:var(--green-700)}

/* Panels & grid */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)} .g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.col-span-2{grid-column:span 2}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column}
.panel-head{padding:15px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-head h3{margin:0;font-size:15px;font-weight:800;color:var(--teal-800)}
.panel-head .p-sub{font-size:11.5px;color:var(--muted);font-weight:600}
.panel-body{padding:8px 18px 18px;flex:1}
.chart{width:100%;height:300px}
.chart.sm{height:240px} .chart.lg{height:380px}

/* Tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:start;padding:10px 12px;color:var(--muted);font-weight:700;font-size:11.5px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
table.tbl tr:hover td{background:var(--panel-2)}
table.tbl.clickable tr{cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}

/* Badges & bars */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-ok{background:rgba(22,163,74,.12);color:var(--green-700)}
.b-warn{background:rgba(224,164,0,.15);color:#a16207}
.b-danger{background:rgba(220,38,38,.12);color:var(--danger)}
.b-watch{background:rgba(37,99,235,.12);color:var(--watch)}
.b-muted{background:#eef2f5;color:var(--muted)}
.b-teal{background:rgba(18,114,110,.12);color:var(--teal-700)}
.bar{height:8px;background:var(--line-2);border-radius:6px;overflow:hidden;min-width:80px}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--brand-grad-soft)}
.bar.red > i{background:linear-gradient(90deg,#ef4444,#b91c1c)}
.bar.amber > i{background:linear-gradient(90deg,#f59e0b,#d97706)}
.progress-ring{--sz:96px}

/* Section KPIs inline */
.mini-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mini-kpi{background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px}
.mini-kpi .m-l{font-size:11px;color:var(--muted);font-weight:700}
.mini-kpi .m-v{font-size:19px;font-weight:800;color:var(--ink);margin-top:3px}

/* Empty & loading */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty svg{width:70px;height:70px;opacity:.5;margin-bottom:14px}
.empty h3{color:var(--ink-2);margin:0 0 6px}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--green-500);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,#eef2f5 25%,#e2e8ee 37%,#eef2f5 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* Insights */
.insight{display:flex;gap:12px;padding:13px 15px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;background:#fff;align-items:flex-start}
.insight .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.insight.critical{border-inline-start:4px solid var(--danger)} .insight.critical .dot{background:var(--danger)}
.insight.high{border-inline-start:4px solid #f59e0b} .insight.high .dot{background:#f59e0b}
.insight.medium{border-inline-start:4px solid var(--watch)} .insight.medium .dot{background:var(--watch)}
.insight.low{border-inline-start:4px solid var(--muted)} .insight.low .dot{background:var(--muted)}
.insight .i-t{font-weight:800;font-size:13.5px;color:var(--ink)}
.insight .i-d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.insight .i-cat{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* Exec summary */
.exec{background:linear-gradient(135deg,#0a3f42,#0e5a5a);color:#eaf6f2;border-radius:var(--radius);padding:22px;position:relative;overflow:hidden}
.exec::after{content:"";position:absolute;left:-40px;bottom:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(46,204,87,.35),transparent 70%)}
.exec h3{margin:0 0 4px;font-size:17px}
.exec .es-item{position:relative;z-index:1;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.exec .es-item:last-child{border:none}
.exec .es-t{font-weight:800;font-size:13px;color:#9ff0c4}
.exec .es-x{font-size:13px;opacity:.95;margin-top:2px}
.exec ul{margin:6px 0 0;padding-inline-start:18px}
.exec li{margin:3px 0;font-size:12.5px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,30,32,.55);backdrop-filter:blur(3px);z-index:70;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);width:min(920px,96vw);max-height:92vh;overflow:auto;animation:pop .3s ease}
.modal.sm{width:min(520px,96vw)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
.modal-head h3{margin:0;font-size:17px;color:var(--teal-800)}
.modal-close{border:none;background:var(--panel-2);width:34px;height:34px;border-radius:10px;font-size:18px;color:var(--muted)}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;font-family:inherit;background:var(--panel-2)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green-500);background:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* Employee 360 */
.emp-hero{display:flex;gap:18px;align-items:center;padding:20px 22px;background:var(--brand-grad);color:#fff;border-radius:16px;margin-bottom:18px;flex-wrap:wrap}
.emp-hero .e-av{width:66px;height:66px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:26px;font-weight:800}
.emp-hero .e-name{font-size:20px;font-weight:800}
.emp-hero .e-meta{opacity:.9;font-size:13px;margin-top:3px}
.emp-hero .e-tags{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.emp-hero .e-tags .t{background:rgba(255,255,255,.2);border-radius:20px;padding:3px 12px;font-size:11.5px;font-weight:700}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.info-cell{background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px}
.info-cell .l{font-size:11px;color:var(--muted);font-weight:700}
.info-cell .v{font-size:14px;font-weight:700;color:var(--ink);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Timeline */
.timeline{position:relative;padding-inline-start:22px;margin-top:6px}
.timeline::before{content:"";position:absolute;inset-inline-start:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item .tl-dot{position:absolute;inset-inline-start:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--green-500);border:2px solid #fff;box-shadow:0 0 0 2px var(--green-500)}
.tl-item.type-salary .tl-dot{background:#f59e0b;box-shadow:0 0 0 2px #f59e0b}
.tl-item.type-position .tl-dot{background:var(--watch);box-shadow:0 0 0 2px var(--watch)}
.tl-item.type-joined .tl-dot{background:var(--teal-700);box-shadow:0 0 0 2px var(--teal-700)}
.tl-date{font-size:11.5px;color:var(--muted);font-weight:700}
.tl-title{font-weight:800;font-size:13.5px;color:var(--ink)}
.tl-detail{font-size:12.5px;color:var(--ink-2)}

/* Upload wizard */
.dropzone{border:2.5px dashed var(--line);border-radius:18px;padding:44px;text-align:center;background:var(--panel-2);transition:.2s;cursor:pointer}
.dropzone.drag{border-color:var(--green-500);background:rgba(31,174,74,.06)}
.dropzone svg{width:56px;height:56px;color:var(--teal-600);opacity:.8;margin-bottom:12px}
.dropzone h3{margin:0 0 4px;color:var(--teal-800)}
.dropzone p{margin:0;color:var(--muted);font-size:13px}
.steps{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.step{flex:1;min-width:120px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:9px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.step.active{border-color:var(--green-500);color:var(--teal-800)} .step.active .n{background:var(--green-600);color:#fff}
.step.done .n{background:var(--teal-700);color:#fff} .step.done{color:var(--teal-700)}
.map-row{display:grid;grid-template-columns:1.3fr auto 1.3fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.map-row .col-name{font-weight:700;font-size:13px}
.map-row select{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:12.5px;background:var(--panel-2);width:100%}
.conf{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
.conf.confirmed{background:rgba(22,163,74,.14);color:var(--green-700)}
.conf.high{background:rgba(37,99,235,.12);color:var(--watch)}
.conf.review{background:rgba(224,164,0,.16);color:#a16207}
.conf.dynamic{background:rgba(18,114,110,.12);color:var(--teal-700)}

/* Waterfall legend etc */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:600}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:4px}

/* Toast */
.toast-wrap{position:fixed;bottom:22px;inset-inline-start:22px;z-index:90;display:flex;flex-direction:column;gap:10px}
.toast{background:#0f1e2b;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;animation:pop .3s ease;max-width:360px}
.toast.ok{background:var(--green-700)} .toast.err{background:var(--danger)}

/* Compliance matrix */
.matrix{display:grid;gap:2px;font-size:12px}
.mx-cell{padding:9px 8px;text-align:center;border-radius:8px;font-weight:700}
.mx-head{background:var(--panel-2);color:var(--muted);font-size:11px}
.mx-row-label{text-align:start;font-weight:800;color:var(--ink-2);background:var(--panel-2);padding:9px 12px;border-radius:8px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 15px;border:none;background:none;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--teal-700);border-color:var(--green-500)}

.data-note{background:rgba(224,164,0,.08);border:1px solid rgba(224,164,0,.3);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#8a6400;font-weight:600;display:flex;gap:8px;align-items:flex-start;margin-bottom:14px}

      series: series.map((s, i) => ({
        name: s.name, type: 'bar', stack: 'total', data: s.data, barMaxWidth: 26,
        itemStyle: { color: s.color || CATS[i], borderRadius: i === series.length - 1 ? (opts.horizontal ? [0, 5, 5, 0] : [5, 5, 0, 0]) : 0 },
      })),
    });
  }

  // Treemap
  function treemap(el, data) {
    return render(el, {
      textStyle: baseTextStyle(),
      tooltip: tooltip({ formatter: (p) => `${p.name}<br><b>${fmtN(p.value)}</b>` }),
      series: [{
        type: 'treemap', roam: false, nodeClick: false, breadcrumb: { show: false },
        data, width: '100%', height: '100%', top: 4, bottom: 4, left: 4, right: 4,
        label: { fontFamily: FONT, fontSize: 12, fontWeight: 700, color: '#fff', formatter: (p) => `${p.name}\n${fmtN(p.value)}` },
        itemStyle: { borderColor: '#fff', borderWidth: 2, gapWidth: 2 },
        levels: [{ color: CATS, colorMappingBy: 'index' }],
      }],
    });
  }

  // Line / trend
  function line(el, cats, series, opts = {}) {
    return render(el, {
      textStyle: baseTextStyle(), color: opts.colors || CATS,
      grid: { left: 8, right: 18, top: 24, bottom: 8, containLabel: true },
      tooltip: tooltip({ trigger: 'axis' }),
      legend: series.length > 1 ? { top: 0, textStyle: { fontFamily: FONT, color: BRAND.muted, fontSize: 11.5 } } : undefined,
      xAxis: { type: 'category', data: cats, boundaryGap: false, axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 11 } },
      yAxis: { type: 'value', axisLabel: { color: BRAND.muted, fontFamily: FONT }, splitLine: { lineStyle: { color: BRAND.line } } },
      series: series.map((s, i) => ({
        name: s.name, type: 'line', smooth: true, data: s.data, symbol: 'circle', symbolSize: 7,
        lineStyle: { width: 3 }, areaStyle: opts.area ? { opacity: .12 } : undefined,
      })),
    });
  }

  // Waterfall (workforce movement)
  function waterfall(el, items) {
    // items: [{name, value, type:'total'|'inc'|'dec'}]
    let running = 0; const base = [], up = [], down = [], tot = [];
    items.forEach((it) => {
      if (it.type === 'total') { base.push('-'); up.push('-'); down.push('-'); tot.push(it.value); running = it.value; }
      else if (it.value >= 0) { base.push(running); up.push(it.value); down.push('-'); tot.push('-'); running += it.value; }
      else { running += it.value; base.push(running); up.push('-'); down.push(-it.value); tot.push('-'); }
    });
    return render(el, {
      textStyle: baseTextStyle(),
      grid: { left: 8, right: 16, top: 20, bottom: 8, containLabel: true },
      tooltip: tooltip({ trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: (p) => { const it = items[p[0].dataIndex]; return `${it.name}<br><b>${fmtN(it.value)}</b>`; } }),
      xAxis: { type: 'category', data: items.map((i) => i.name), axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 10.5, interval: 0, rotate: 22 } },
      yAxis: { type: 'value', axisLabel: { color: BRAND.muted, fontFamily: FONT }, splitLine: { lineStyle: { color: BRAND.line } } },
      series: [
        { type: 'bar', stack: 'w', itemStyle: { color: 'transparent' }, data: base },
        { type: 'bar', stack: 'w', data: up, itemStyle: { color: '#1E883F', borderRadius: [4, 4, 0, 0] }, barMaxWidth: 34, label: { show: true, position: 'top', formatter: (p) => p.value === '-' ? '' : '+' + fmtN(p.value), fontFamily: FONT, fontSize: 10, color: '#156835', fontWeight: 700 } },
        { type: 'bar', stack: 'w', data: down, itemStyle: { color: '#dc2626', borderRadius: [4, 4, 0, 0] }, barMaxWidth: 34, label: { show: true, position: 'top', formatter: (p) => p.value === '-' ? '' : '−' + fmtN(p.value), fontFamily: FONT, fontSize: 10, color: '#b91c1c', fontWeight: 700 } },
        { type: 'bar', stack: 'w', data: tot, itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: '#0B4D2E' }, { offset: 1, color: '#0B4D2E' }]), borderRadius: [4, 4, 0, 0] }, barMaxWidth: 34, label: { show: true, position: 'top', formatter: (p) => p.value === '-' ? '' : fmtN(p.value), fontFamily: FONT, fontSize: 11, color: BRAND.ink, fontWeight: 800 } },
      ],
    });
  }

  // Heatmap (nationality x section)
  function heatmap(el, rows, cols, data, opts = {}) {
    const max = Math.max(1, ...data.map((d) => d[2]));
    return render(el, {
      textStyle: baseTextStyle(),
      tooltip: tooltip({ formatter: (p) => `${cols[p.value[0]]} · ${rows[p.value[1]]}<br><b>${fmtN(p.value[2])}</b>` }),
      grid: { left: 8, right: 14, top: 10, bottom: 60, containLabel: true },
      xAxis: { type: 'category', data: cols, splitArea: { show: true }, axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 10, rotate: 40, interval: 0 } },
      yAxis: { type: 'category', data: rows, splitArea: { show: true }, axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 10.5, width: 90, overflow: 'truncate' } },
      visualMap: { min: 0, max, calculable: true, orient: 'horizontal', left: 'center', bottom: 0, inRange: { color: ['#eef7f2', '#7fd0a1', '#1E883F', '#0B4D2E'] }, textStyle: { fontFamily: FONT, color: BRAND.muted } },
      series: [{ type: 'heatmap', data, label: { show: opts.showLabel !== false, fontFamily: FONT, fontSize: 10, color: '#0f1e2b' }, itemStyle: { borderColor: '#fff', borderWidth: 1 }, emphasis: { itemStyle: { shadowBlur: 8, shadowColor: 'rgba(0,0,0,.25)' } } }],
    });
  }

  // Gauge / progress ring
  function gauge(el, value, opts = {}) {
    const color = opts.color || (value >= (opts.target || 100) ? '#1E883F' : value >= 50 ? '#e0a400' : '#dc2626');
    return render(el, {
      series: [{
        type: 'gauge', startAngle: 220, endAngle: -40, min: 0, max: 100, radius: '96%', center: ['50%', '56%'],
        progress: { show: true, width: 14, itemStyle: { color } },
        axisLine: { lineStyle: { width: 14, color: [[1, '#eef2f5']] } },
        pointer: { show: false }, axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
        anchor: { show: false }, title: { show: false },
        detail: { valueAnimation: true, formatter: (v) => (opts.pct ? v.toFixed(opts.dec ?? 1) + '%' : v.toFixed(0)), fontFamily: FONT, fontSize: 26, fontWeight: 800, color: BRAND.ink, offsetCenter: [0, 0] },
        data: [{ value }],
      }],
    });
  }

  window.Chart = { render, donut, barH, barV, stacked, treemap, line, waterfall, heatmap, gauge, resizeAll, disposeAll, CATS, BRAND, fmtN };
})();
</script>

 Pages.workforce = async function (content) {
 if (!App.state.hasData) return noData(content);

 ${kpi({ label: 'تغييرات المسمى', value: fmt.n(r.positionChanges), accent: 'teal', ico: 'repeat' })}

 content.innerHTML = head('المستخدمون والصلاحيات', 'إدارة الأدوار — الرواتب مقيّدة بصلاحية خاصة', `<button class="btn btn-primary" id="addUser">+ مستخدم جديد</button>`) +
 `<div class="panel"><div class="panel-body tbl-wrap"><table class="tbl responsive-cards"><thead><tr><th>المستخدم</th><th>الاسم</th><th>الدور</th><th>الحالة</th><th></th></tr></thead><tbody>
 ${users.map((u) => `<tr><td data-l="المستخدم"><b>${fmt.esc(u.username)}</b></td><td data-l="الاسم">${fmt.esc(u.name)}</td><td data-l="الدور"><span class="badge b-teal">${fmt.esc((u.roleLabel || u.role))}</span></td><td data-l="الحالة"><span class="badge b-ok">نشط</span></td><td class="no-print"><button class="btn" style="padding:5px 10px" data-edit-user='${JSON.stringify(u).replace(/'/g, "&#39;")}'>تعديل</button></td></tr>`).join('')}
 </tbody></table></div></div>
 <div class="panel" style="margin-top:16px"><div class="panel-head"><h3>مصفوفة الأدوار</h3></div><div class="panel-body">
 <div class="info-grid">
 ${roleInfo('Admin', 'صلاحية كاملة على النظام')}
 ${roleInfo('HR Manager', 'الموارد البشرية + الرواتب + التقارير')}
 ${roleInfo('HR Officer', 'بيانات الموظفين + الإجازات + الانتهاء (بدون رواتب)')}
 ${roleInfo('Department Manager', 'القسم فقط')}
 ${roleInfo('Viewer', 'لوحة القيادة فقط')}
 </div></div></div>`;
 el('addUser').addEventListener('click', () => openUserForm(r.roles));
 content.querySelectorAll('[data-edit-user]').forEach((b) => b.addEventListener('click', () => openUserForm(r.roles, JSON.parse(b.dataset.editUser))));
 };
 function roleInfo(name, desc) { return `<div class="info-cell"><div class="l">${name}</div><div class="v" style="font-size:12.5px;font-weight:600">${desc}</div></div>`; }
 function openUserForm(roles, user) {
 const u = user || {};
 const opts = Object.entries(roles).map(([k, v]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${fmt.esc(v.label)}</option>`).join('');
 const m = modal(`<div class="modal-head"><h3>${user ? 'تعديل مستخدم' : 'مستخدم جديد'}</h3><button class="modal-close">✕</button></div><div class="modal-body">
 <div class="field"><label>اسم المستخدم</label><input id="uName" value="${fmt.esc(u.username || '')}" ${user ? 'disabled' : ''}></div>
 <div class="field"><label>الاسم الكامل</label><input id="uFull" value="${fmt.esc(u.name || '')}"></div>
 <div class="field"><label>الدور / الصلاحية</label><select id="uRole">${opts}</select></div>
 <div class="field"><label>رمز الدخول ${user ? '(اتركه فارغاً لعدم التغيير)' : ''}</label><input id="uPass" type="password" placeholder="••••••"></div>
 </div><div class="modal-foot"><button class="btn modal-close">إلغاء</button><button class="btn btn-primary" id="uSave">حفظ</button></div>`, { sm: true });
 el('uSave').addEventListener('click', async () => {
 try {
 if (user) { const body = { name: el('uFull').value.trim(), role: el('uRole').value }; if (el('uPass').value) body.passcode = el('uPass').value; await api('/api/users/' + u.id, { method: 'PUT', body: JSON.stringify(body) }); }
 else { if (!el('uName').value.trim() || !el('uPass').value) { toast('اسم المستخدم ورمز الدخول مطلوبان', 'err'); return; } await api('/api/users', { method: 'POST', body: JSON.stringify({ username: el('uName').value.trim(), name: el('uFull').value.trim(), role: el('uRole').value, passcode: el('uPass').value }) }); }
 m.close(); toast('تم الحفظ', 'ok'); window.route();
 } catch (e) { toast(e.body?.error || 'خطأ', 'err'); }
 });
 }

})();
</script>
<script>/* upload.standalone.js — fully client-side Excel upload for the hosted build.
   Reads the file with SheetJS in the browser, runs the same mapping / validation
   / analytics engine (window.HR), and adds a snapshot to the in-memory store —
   so the user can update the data and everything recomputes, no server needed. */
(function () {
  const el = (id) => document.getElementById(id);
  const HR = () => window.HR;
  const CORE_TARGETS = [
    ['employee_code', 'الرقم الوظيفي'], ['name', 'الاسم (إنجليزي)'], ['arabic_name', 'الاسم (عربي)'],
    ['level_code', 'الدرجة الوظيفية'], ['division', 'المنشأة / Division'], ['section', 'القسم'],
    ['position', 'المسمى الوظيفي'], ['total_salary', 'إجمالي الراتب'], ['end_annual_balance', 'رصيد الإجازة السنوية'],
    ['end_holiday_balance', 'رصيد الـHoliday'], ['gender', 'الجنس'], ['nationality', 'الجنسية'],
    ['hiring_date', 'تاريخ التعيين'], ['contract_expire_date', 'انتهاء العقد'], ['probation_date', 'انتهاء التجربة'],
    ['health_card_expire_date', 'انتهاء البطاقة الصحية'], ['residence_expire_date', 'انتهاء الإقامة'],
    ['passport_expire_date', 'انتهاء الجواز'],
  ];
  let W = null;

  function readWB(arrayBuffer) {
    const X = window.XLSX;
    const wb = X.read(arrayBuffer, { type: 'array', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    if (!ws) throw new Error('لا يحتوي الملف على ورقة صالحة');
    const grid = X.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
    let hr = 0, best = -1;
    for (let i = 0; i < Math.min(grid.length, 15); i++) { const c = grid[i] || []; const sc = c.filter((x) => typeof x === 'string' && x.trim()).length; if (sc > best) { best = sc; hr = i; } }
    const headers = (grid[hr] || []).map((h, i) => (h == null || String(h).trim() === '') ? `Column ${i + 1}` : String(h).trim());
    const rows = [];
    for (let r = hr + 1; r < grid.length; r++) { const arr = grid[r] || []; if (arr.every((c) => c == null || String(c).trim() === '')) continue; const o = {}; headers.forEach((h, i) => { o[h] = arr[i] === undefined ? null : arr[i]; }); rows.push(o); }
    return { headers, rows };
  }

  function steps(active) {
    const s = [['1', 'رفع الملف'], ['2', 'مطابقة الأعمدة'], ['3', 'الفحص والتنظيف'], ['4', 'الاعتماد']];
    return `<div class="steps">${s.map((x, i) => `<div class="step ${i + 1 === active ? 'active' : i + 1 < active ? 'done' : ''}"><span class="n">${i + 1 < active ? '✓' : x[0]}</span>${x[1]}</div>`).join('')}</div>`;
  }
  function h(t) { return `<div class="page-head"><div><h2>رفع بيانات Excel الذكي</h2><div class="sub">${t}</div></div></div>`; }
  function kpiMini(l, v, a) { return `<div class="kpi ${a ? 'accent-' + a : ''}"><div class="k-top"><span class="k-label">${l}</span></div><div class="k-val">${fmt.n(v)}</div></div>`; }
  function typeLabel(t) { return { string: 'نص', number: 'رقم', date: 'تاريخ', key: 'مفتاح' }[t] || t; }
  function sampleValue(col) { const s = (W.rows || []).find((r) => r[col] != null && r[col] !== ''); return s ? String(s[col]).slice(0, 20) : '—'; }

  Pages.upload = function (content) {
    W = null;
    content.innerHTML = h('ارفع ملف الموظفين الشهري — القراءة تتم بالكامل داخل متصفحك، بدون خادم') + steps(1) +
      `<div class="panel"><div class="panel-body">
        <div class="dropzone" id="dz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 16V4m0 0L8 8m4-4l4 4M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          <h3>اسحب ملف Excel هنا أو اضغط للاختيار</h3><p>يدعم .xlsx و .xls — تُقرأ الأعمدة بالاسم لا بالترتيب</p>
          <input type="file" id="fileInput" accept=".xlsx,.xls" hidden></div>
        <div id="uploadStatus" style="margin-top:14px"></div>
      </div></div>
      <div class="data-note">ملاحظة: هذه نسخة تعمل في المتصفح؛ البيانات التي ترفعها تبقى في جهازك لهذه الجلسة فقط. للحفظ الدائم ومشاركة الفريق استخدم النسخة المستضافة على خادم.</div>`;
    const dz = el('dz'), input = el('fileInput');
    dz.addEventListener('click', () => input.click());
    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
    dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('drag'); if (e.dataTransfer.files[0]) doUpload(e.dataTransfer.files[0]); });
    input.addEventListener('change', () => { if (input.files[0]) doUpload(input.files[0]); });
  };

  function doUpload(file) {
    el('uploadStatus').innerHTML = '<div class="spinner"></div><p style="text-align:center;color:var(--muted)">جارٍ قراءة الملف وتحليل الأعمدة…</p>';
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const { headers, rows } = readWB(reader.result);
        if (!rows.length) throw new Error('الملف لا يحتوي على سجلات');
        const mapping = HR().proposeMapping(headers, rows);
        const period = HR().detectPeriod(file.name);
        W = { fileName: file.name, headers, rows, mapping, period, approvedNorm: {} };
        renderMapping();
      } catch (e) { el('uploadStatus').innerHTML = `<div class="data-note" style="border-color:var(--danger);color:var(--danger)">تعذّرت قراءة الملف: ${fmt.esc(e.message || '')}</div>`; }
    };
    reader.onerror = () => { el('uploadStatus').innerHTML = `<div class="data-note" style="border-color:var(--danger)">خطأ في قراءة الملف</div>`; };
    reader.readAsArrayBuffer(file);
  }

  function renderMapping() {
    const content = el('content');
    const conf = (m) => `<span class="conf ${m.status}">${m.status === 'confirmed' ? 'مؤكّد' : m.status === 'high' ? 'مطابقة عالية' : m.status === 'review' ? 'يحتاج مراجعة' : 'حقل ديناميكي'} ${m.confidence ? Math.round(m.confidence * 100) + '%' : ''}</span>`;
    const targetSelect = (m) => {
      const used = new Set(W.mapping.filter((x) => x !== m && !x.isDynamic && x.status !== 'ignore').map((x) => x.mappedKey));
      const opts = CORE_TARGETS.map(([k, l]) => `<option value="${k}" ${m.mappedKey === k ? 'selected' : ''} ${used.has(k) && m.mappedKey !== k ? 'disabled' : ''}>${l}</option>`).join('');
      return `<select data-col="${fmt.esc(m.column)}"><option value="__dynamic__" ${m.isDynamic ? 'selected' : ''}>حقل ديناميكي (${fmt.esc(m.column)})</option><option value="__ignore__" ${m.status === 'ignore' ? 'selected' : ''}>تجاهل هذا العمود</option>${opts}</select>`;
    };
    const reviewCount = W.mapping.filter((m) => m.status === 'review').length;
    const dynCount = W.mapping.filter((m) => m.isDynamic).length;
    content.innerHTML = h(`الملف: ${fmt.esc(W.fileName)} · ${fmt.n(W.rows.length)} سجل`) + steps(2) +
      `<div class="kpi-grid">${kpiMini('أعمدة الملف', W.mapping.length)}${kpiMini('حقول أساسية مطابقة', W.mapping.filter((m) => !m.isDynamic && m.status !== 'ignore').length)}${kpiMini('حقول ديناميكية', dynCount)}${kpiMini('تحتاج مراجعة', reviewCount, reviewCount ? 'amber' : '')}</div>
      ${reviewCount ? `<div class="data-note">يوجد ${reviewCount} عمود بمطابقة غير مؤكّدة. راجعها واعتمد التعيين الصحيح.</div>` : `<div class="data-note" style="border-color:rgba(30,136,63,.35);background:rgba(30,136,63,.07);color:var(--green-700)">تم التعرف على جميع الأعمدة بالاسم (بغضّ النظر عن ترتيبها).</div>`}
      <div class="panel"><div class="panel-head"><h3>مطابقة الأعمدة</h3><span class="p-sub">العمود في الملف ← الحقل في النظام</span></div><div class="panel-body">
        <div class="map-row" style="font-weight:800;color:var(--muted);font-size:11px;border-bottom:2px solid var(--line)"><div>العمود في الملف</div><div>الثقة</div><div>الحقل المرجعي</div><div>نوع البيانات</div></div>
        ${W.mapping.map((m) => `<div class="map-row"><div class="col-name">${fmt.esc(m.column)}<div style="font-size:11px;color:var(--muted);font-weight:400">مثال: ${fmt.esc(sampleValue(m.column))}</div></div><div>${conf(m)}</div><div>${targetSelect(m)}</div><div><span class="badge b-muted">${typeLabel(m.dataType)}</span></div></div>`).join('')}
      </div></div>
      <div class="ph-actions" style="justify-content:flex-end;margin-top:16px;display:flex;gap:10px"><button class="btn" id="cancelUp">إلغاء</button><button class="btn btn-primary" id="toValidate">التالي: الفحص والتنظيف</button></div>`;
    content.querySelectorAll('select[data-col]').forEach((s) => s.addEventListener('change', () => {
      const m = W.mapping.find((x) => x.column === s.dataset.col);
      if (s.value === '__dynamic__') { m.isDynamic = true; m.status = 'dynamic'; m.mappedKey = 'dyn_' + m.column.toLowerCase().replace(/\W+/g, '_'); }
      else if (s.value === '__ignore__') { m.status = 'ignore'; m.isDynamic = false; m.mappedKey = '__ignore__'; }
      else { m.isDynamic = false; m.status = 'confirmed'; m.mappedKey = s.value; }
      renderMapping();
    }));
    el('cancelUp').addEventListener('click', () => Pages.upload(content));
    el('toValidate').addEventListener('click', renderValidation);
  }

  function buildNormMaps() {
    const maps = {};
    for (const [field, approved] of Object.entries(W.approvedNorm)) {
      const sug = W.validation && W.validation.normalization && W.validation.normalization[field];
      if (!sug) continue; maps[field] = {};
      sug.suggestions.forEach((s, i) => { if (approved[i]) maps[field][s.from] = s.to; });
    }
    return maps;
  }

  function renderValidation() {
    const content = el('content');
    const { records } = HR().buildRecords(W.headers, W.rows, W.mapping, buildNormMaps());
    W.validation = HR().validate(records, W.mapping);
    W.kpis = HR().computeKPIs(records, W.period.asOf);
    const v = W.validation, q = v.quality, c = v.counts;
    const issue = (label, n, tone) => `<div class="mini-kpi"><div class="m-l">${label}</div><div class="m-v" style="color:${n ? (tone || 'var(--danger)') : 'var(--ok)'}">${fmt.n(n)}</div></div>`;
    content.innerHTML = h(`${fmt.esc(W.fileName)} — نتيجة الفحص`) + steps(3) +
      `<div class="grid g-3" style="margin-bottom:16px">
        <div class="panel"><div class="panel-head"><h3>مؤشر جودة البيانات</h3></div><div class="panel-body"><div id="qGauge" class="chart sm"></div></div></div>
        <div class="panel col-span-2"><div class="panel-head"><h3>ملخّص الفحص</h3></div><div class="panel-body"><div class="mini-kpis">
          <div class="mini-kpi"><div class="m-l">إجمالي السجلات</div><div class="m-v">${fmt.n(v.total)}</div></div>
          <div class="mini-kpi"><div class="m-l">سجلات صحيحة</div><div class="m-v" style="color:var(--ok)">${fmt.n(v.valid)}</div></div>
          <div class="mini-kpi"><div class="m-l">بها مشاكل</div><div class="m-v" style="color:${v.invalid ? 'var(--danger)' : 'var(--ok)'}">${fmt.n(v.invalid)}</div></div>
          ${issue('رقم وظيفي مكرر', c.duplicate_code)}${issue('بدون رقم وظيفي', c.missing_code)}${issue('بدون اسم', c.missing_name)}${issue('بدون قسم', c.missing_section, 'var(--warn)')}${issue('رواتب غير منطقية', c.illogical_salary)}${issue('تواريخ غير صحيحة', c.invalid_date, 'var(--warn)')}${issue('حقول وثائق فارغة', c.missing_document, 'var(--muted)')}
        </div></div></div>
      </div>
      <div class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>تفصيل مؤشر الجودة (${fmt.pct(q.score, 1)})</h3><span class="p-sub">أسباب فقدان النقاط</span></div><div class="panel-body tbl-wrap">
        <table class="tbl"><thead><tr><th>المعيار</th><th>الوزن</th><th>المكتسبة</th><th>المفقودة</th><th>السبب</th></tr></thead><tbody>
        ${q.breakdown.map((b) => `<tr><td><b>${fmt.esc(b.label)}</b></td><td class="num">${b.weight}%</td><td class="num" style="color:var(--ok)">${b.earned}</td><td class="num" style="color:${b.lost ? 'var(--danger)' : 'var(--muted)'}">${b.lost || '—'}</td><td style="color:var(--muted)">${fmt.esc(b.reason || '—')}</td></tr>`).join('')}
        </tbody></table></div></div>
      ${renderNorm(v.normalization)}
      <div class="data-note">يحتفظ النظام دائماً بالقيمة الأصلية بجانب المطبّعة؛ لا تُعدَّل بياناتك الأصلية.</div>
      <div class="ph-actions" style="justify-content:space-between;margin-top:16px;display:flex;gap:10px"><button class="btn" id="backMap">رجوع للمطابقة</button><button class="btn btn-primary" id="toCommit">التالي: الاعتماد</button></div>`;
    requestAnimationFrame(() => requestAnimationFrame(() => Chart.gauge(el('qGauge'), q.score, { pct: true, dec: 1 })));
    el('backMap').addEventListener('click', renderMapping);
    el('toCommit').addEventListener('click', renderCommit);
    content.querySelectorAll('[data-norm]').forEach((chk) => chk.addEventListener('change', () => { const [f, i] = chk.dataset.norm.split('|'); W.approvedNorm[f] = W.approvedNorm[f] || {}; W.approvedNorm[f][i] = chk.checked; }));
    content.querySelectorAll('[data-norm-all]').forEach((btn) => btn.addEventListener('click', () => { const f = btn.dataset.normAll; W.approvedNorm[f] = {}; W.validation.normalization[f].suggestions.forEach((s, i) => W.approvedNorm[f][i] = true); renderValidation(); }));
  }
  function renderNorm(norm) {
    if (!norm || !Object.keys(norm).length) return '';
    const L = { nationality: 'الجنسيات', section: 'الأقسام', position: 'المسميات', division: 'المنشآت', gender: 'الجنس', level_code: 'الدرجات' };
    return `<div class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>اقتراحات التوحيد</h3><span class="p-sub">اعتمدها لتُطبّق عند الحفظ</span></div><div class="panel-body">
      ${Object.entries(norm).map(([f, sug]) => `<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>${L[f] || f}</b><button class="btn" style="padding:4px 10px" data-norm-all="${f}">اعتماد الكل</button></div>${sug.suggestions.map((s, i) => `<label style="display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line-2);border-radius:10px;margin-bottom:6px;cursor:pointer"><input type="checkbox" data-norm="${f}|${i}" ${W.approvedNorm[f] && W.approvedNorm[f][i] ? 'checked' : ''}><span style="flex:1"><span class="badge b-warn">${fmt.esc(s.from)}</span> ← <span class="badge b-ok">${fmt.esc(s.to)}</span></span><span style="color:var(--muted);font-size:11.5px">${fmt.n(s.count)} سجل · تشابه ${Math.round(s.similarity * 100)}%</span></label>`).join('')}</div>`).join('')}</div></div>`;
  }

  function renderCommit() {
    const content = el('content'); const p = W.period; const k = W.kpis;
    content.innerHTML = h('اعتماد البيانات') + steps(4) +
      `<div class="grid g-2">
        <div class="panel"><div class="panel-head"><h3>فترة التقرير</h3></div><div class="panel-body">
          ${p.confident ? `<div class="data-note" style="border-color:rgba(30,136,63,.35);background:rgba(30,136,63,.07);color:var(--green-700)">تم تحديد الفترة من اسم الملف: <b>${fmt.esc(p.label)}</b></div>` : `<div class="data-note">تعذّر تحديد الفترة من اسم الملف — عدّلها إن لزم.</div>`}
          <div class="form-grid">
            <div class="field"><label>اسم الفترة</label><input id="pLabel" value="${fmt.esc(p.label)}"></div>
            <div class="field"><label>رمز الفترة (YYYY-MM)</label><input id="pValue" value="${fmt.esc(p.value)}"></div>
            <div class="field"><label>تاريخ البيانات</label><input id="pAsOf" type="date" value="${fmt.esc(p.asOf)}"></div>
          </div>
        </div></div>
        <div class="panel"><div class="panel-head"><h3>معاينة المؤشرات</h3></div><div class="panel-body"><div class="mini-kpis">
          <div class="mini-kpi"><div class="m-l">إجمالي الموظفين</div><div class="m-v">${fmt.n(k.total_employees)}</div></div>
          <div class="mini-kpi"><div class="m-l">سعوديون</div><div class="m-v">${fmt.n(k.saudi_employees)}</div></div>
          <div class="mini-kpi"><div class="m-l">نسبة السعودة</div><div class="m-v">${fmt.pct(k.saudi_pct)}</div></div>
          <div class="mini-kpi"><div class="m-l">الأقسام</div><div class="m-v">${fmt.n(k.departments)}</div></div>
          <div class="mini-kpi"><div class="m-l">المسميات</div><div class="m-v">${fmt.n(k.positions)}</div></div>
          <div class="mini-kpi"><div class="m-l">جودة البيانات</div><div class="m-v">${fmt.pct(W.validation.quality.score, 1)}</div></div>
        </div></div></div>
      </div>
      <div class="ph-actions" style="justify-content:space-between;margin-top:16px;display:flex;gap:10px"><button class="btn" id="backVal">رجوع</button><button class="btn btn-primary" id="commitBtn">اعتماد وحفظ البيانات</button></div>`;
    el('backVal').addEventListener('click', renderValidation);
    el('commitBtn').addEventListener('click', () => {
      const btn = el('commitBtn'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
      try {
        const period = el('pValue').value.trim(), periodLabel = el('pLabel').value.trim(), asOf = el('pAsOf').value || p.asOf;
        const { records, dynamicFields } = HR().buildRecords(W.headers, W.rows, W.mapping, buildNormMaps());
        const validation = HR().validate(records, W.mapping);
        const id = HR().uuid();
        HR().addSnapshot({ id, period, periodLabel, asOf, fileName: W.fileName }, records, dynamicFields, validation);
        toast('تم اعتماد البيانات', 'ok');
        App.loadState().then(() => { App.filters = {}; location.hash = '#/dashboard'; window.route(); });
      } catch (e) { toast('تعذّر الحفظ: ' + (e.message || ''), 'err'); btn.disabled = false; btn.textContent = 'اعتماد وحفظ البيانات'; }
    });
  }
})();
</script>
<script>/* app.js — core controller: auth, routing, layout, filters, search, print. */
(function () {
 const $ = (s, r = document) => r.querySelector(s);
 const $$ = (s, r = document) => [...r.querySelectorAll(s)];
 document.getElementById('yr').textContent = new Date().getFullYear();

 const App = {
 me: null, state: null, filters: {}, currentRoute: null,
 };
 window.App = App;

 // ---------- API ----------
 async function api(path, opts = {}) {
 const r = await window.clientApi(path, opts);
 if (r.status === 401) { showLogin(); throw new Error('unauthenticated'); }
 if (r.status >= 400) throw Object.assign(new Error((r.body && r.body.error) || 'error'), { status: r.status, body: r.body });
 return r.body;
 }
 function qs(extra = {}) {
 const f = Object.assign({}, App.filters, extra);
 const p = new URLSearchParams();
 Object.entries(f).forEach(([k, v]) => { if (v) p.set(k, v); });
 const s = p.toString();
 return s ? '?' + s : '';
 }
 App.api = api; App.qs = qs;

 // ---------- Formatting ----------
 const fmt = {
 n: (v, d = 0) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }),
 money: (v) => (v == null || isNaN(v)) ? '—' : Number(Math.round(v)).toLocaleString('en-US') + ' <span class="cur">SAR</span>',
 moneyPlain: (v) => (v == null || isNaN(v)) ? '—' : Number(Math.round(v)).toLocaleString('en-US') + ' SAR',
 pct: (v, d = 2) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d) + '%',
 days: (v) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(2) + ' يوم',
 date: (iso) => { if (!iso) return '—'; const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return iso; return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; },
 esc: (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
 };
 window.fmt = fmt;

 function toast(msg, kind = '') {
 const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
 $('#toasts').appendChild(t); setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3400);
 }
 window.toast = toast;

 // ---------- Modal ----------
 function modal(html, opts = {}) {
 const root = $('#modalRoot');
 root.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal ${opts.sm ? 'sm' : ''}">${html}</div></div>`;
 const close = () => { root.innerHTML = ''; };
 $('#mbg').addEventListener('click', (e) => { if (e.target.id === 'mbg' && opts.dismiss !== false) close(); });
 $$('.modal-close', root).forEach((b) => b.addEventListener('click', close));
 return { close, root };
 }
 window.modal = modal;

 // ---------- Nav definition ----------
 const NAV = [
 { group: 'الرئيسية', items: [
 { id: 'dashboard', label: 'لوحة القيادة التنفيذية', perm: 'view_dashboard', ico: 'activity' },
 { id: 'insights', label: 'رؤى الذكاء الاصطناعي', perm: 'view_insights', ico: 'activity' },
 ]},
 { group: 'تحليلات القوى العاملة', items: [
 { id: 'workforce', label: 'تحليلات القوى العاملة', perm: 'view_workforce', ico: 'users' },
 { id: 'saudization', label: 'السعودة والتوطين', perm: 'view_saudization', ico: 'user-check' },
 { id: 'nationality', label: 'تحليلات الجنسيات', perm: 'view_nationality', ico: 'globe' },
 { id: 'departments', label: 'تحليلات الأقسام', perm: 'view_departments', ico: 'building' },
 { id: 'jobtitles', label: 'المسميات الوظيفية', perm: 'view_jobtitles', ico: 'briefcase' },
 ]},
 { group: 'الموظفون والحركات', items: [
 { id: 'employees', label: 'الموظفون والبحث', perm: 'view_employees', ico: 'search' },
 { id: 'movements', label: 'الترقيات والحركات', perm: 'view_movements', ico: 'trending-up' },
 { id: 'monthly', label: 'الحركة الشهرية', perm: 'view_movements', ico: 'repeat' },
 { id: 'compare', label: 'المقارنة الشهرية', perm: 'view_comparison', ico: 'scale' },
 ]},
 { group: 'الرصيد والامتثال', items: [
 { id: 'leave', label: 'الإجازات والأرصدة', perm: 'view_leave', ico: 'sun' },
 { id: 'salary', label: 'تحليلات الرواتب', perm: 'view_salary', ico: 'wallet' },
 { id: 'expiry', label: 'الانتهاء والامتثال', perm: 'view_expiry', ico: 'clock' },
 ]},
 { group: 'الإدارة والبيانات', items: [
 { id: 'rules', label: 'مركز قرارات التوطين', perm: 'view_saudization', ico: 'scale' },
 { id: 'upload', label: 'رفع بيانات Excel', perm: 'upload_data', ico: 'arrow-up' },
 { id: 'history', label: 'سجل رفع البيانات', perm: 'view_dashboard', ico: 'layers' },
 { id: 'audit', label: 'سجل التدقيق', perm: 'view_audit', ico: 'shield' },
 { id: 'users', label: 'المستخدمون والصلاحيات', perm: 'manage_users', ico: 'user' },
 ]},
 ];
 function can(perm) { return App.me && App.me.permissions.includes(perm); }
 window.can = can;

 function renderNav() {
 const nav = $('#nav'); nav.innerHTML = '';
 NAV.forEach((g) => {
 const items = g.items.filter((i) => can(i.perm));
 if (!items.length) return;
 const gEl = document.createElement('div'); gEl.className = 'nav-group';
 gEl.innerHTML = `<div class="nav-group-t">${g.group}</div>`;
 items.forEach((i) => {
 const a = document.createElement('a');
 a.className = 'nav-item'; a.href = '#/' + i.id; a.dataset.route = i.id;
 a.innerHTML = `<span class="ico">${window.icon ? icon(i.ico) : ''}</span><span>${i.label}</span>`;
 gEl.appendChild(a);
 });
 nav.appendChild(gEl);
 });
 }

 // ---------- Filters ----------
 const FILTER_PAGES = new Set(['dashboard', 'workforce', 'saudization', 'nationality', 'departments', 'jobtitles', 'leave', 'salary', 'expiry', 'insights']);
 function renderFilters() {
 const bar = $('#filterbar');
 if (!App.state || !App.state.hasData || !FILTER_PAGES.has(App.currentRoute)) { bar.classList.add('hide'); renderActiveFilters(); return; }
 bar.classList.remove('hide');
 const o = App.state.options || {};
 const snaps = App.state.snapshots || [];
 const sel = (key, label, list, valMap) => {
 const opts = ['<option value="">الكل</option>'].concat((list || []).map((v) => {
 const val = valMap ? v.id : v; const txt = valMap ? v.label : v;
 return `<option value="${fmt.esc(val)}" ${App.filters[key] === String(val) ? 'selected' : ''}>${fmt.esc(txt)}</option>`;
 })).join('');
 return `<div class="fl"><label>${label}</label><select data-filter="${key}">${opts}</select></div>`;
 };
 bar.innerHTML =
 sel('period', 'الفترة', snaps.map((s) => ({ id: s.id, label: s.periodLabel || s.period })), true) +
 sel('division', 'المنشأة', o.division) +
 sel('department', 'القسم', o.department) +
 sel('position', 'المسمى', o.position) +
 sel('nationality', 'الجنسية', o.nationality) +
 sel('level', 'الدرجة', o.level) +
 `<div class="fl"><label>الجنس</label><select data-filter="gender"><option value="">الكل</option><option value="male" ${App.filters.gender === 'male' ? 'selected' : ''}>ذكر</option><option value="female" ${App.filters.gender === 'female' ? 'selected' : ''}>أنثى</option></select></div>` +
 `<div class="fl"><label>الجنسية (تصنيف)</label><select data-filter="saudi"><option value="">الكل</option><option value="saudi" ${App.filters.saudi === 'saudi' ? 'selected' : ''}>سعودي</option><option value="non_saudi" ${App.filters.saudi === 'non_saudi' ? 'selected' : ''}>غير سعودي</option></select></div>` +
 `<button class="filter-reset" id="filterReset">✕ مسح الفلاتر</button>`;
 $$('#filterbar select').forEach((s) => s.addEventListener('change', () => {
 App.filters[s.dataset.filter] = s.value; renderActiveFilters(); route();
 }));
 $('#filterReset').addEventListener('click', () => { App.filters = {}; renderFilters(); renderActiveFilters(); route(); });
 renderActiveFilters();
 }
 const FILTER_LABELS = { period: 'الفترة', division: 'المنشأة', department: 'القسم', position: 'المسمى', nationality: 'الجنسية', level: 'الدرجة', gender: 'الجنس', saudi: 'التصنيف' };
 function renderActiveFilters() {
 const el = $('#activeFilters'); const active = Object.entries(App.filters).filter(([k, v]) => v && k !== 'period');
 if (!active.length || App.currentRoute === 'upload') { el.innerHTML = ''; return; }
 el.innerHTML = active.map(([k, v]) => {
 let disp = v; if (k === 'period') { const s = (App.state.snapshots || []).find((x) => x.id === v); disp = s ? s.periodLabel : v; }
 if (k === 'gender') disp = v === 'male' ? 'ذكر' : 'أنثى'; if (k === 'saudi') disp = v === 'saudi' ? 'سعودي' : 'غير سعودي';
 return `<span class="af"><b>${FILTER_LABELS[k]}:</b> ${fmt.esc(disp)} <span data-clear="${k}">✕</span></span>`;
 }).join('');
 $$('#activeFilters [data-clear]').forEach((x) => x.addEventListener('click', () => { delete App.filters[x.dataset.clear]; renderFilters(); route(); }));
 }

 // ---------- Router ----------
 async function route() {
 const hash = location.hash.replace(/^#\/?/, '') || 'dashboard';
 const [page, param] = hash.split('/');
 App.currentRoute = page;
 $$('.nav-item').forEach((a) => a.classList.toggle('active', a.dataset.route === page));
 $('#sidebar').classList.remove('open'); $('.sidebar-backdrop')?.remove();
 renderFilters();
 const content = $('#content');
 if (Chart) Chart.disposeAll();
 // permission gate
 const navItem = NAV.flatMap((g) => g.items).find((i) => i.id === page);
 if (navItem && !can(navItem.perm)) { content.innerHTML = accessDenied(); return; }
 content.innerHTML = '<div class="spinner"></div>';
 try {
 if (page === 'employee') return Pages.employee(content, param);
 if (Pages[page]) return await Pages[page](content, param);
 content.innerHTML = accessDenied('الصفحة غير موجودة');
 } catch (e) {
 if (e.message === 'unauthenticated') return;
 console.error(e); content.innerHTML = `<div class="empty"><h3>تعذّر تحميل الصفحة</h3><p>${fmt.esc(e.message || '')}</p></div>`;
 }
 }
 window.route = route;
 function accessDenied(msg) { return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg><h3>${msg || 'لا تملك صلاحية الوصول'}</h3><p>يرجى التواصل مع مدير النظام لمنحك الصلاحية المناسبة.</p></div>`; }

 // ---------- Global search ----------
 let searchTimer;
 function initSearch() {
 const inp = $('#globalSearch'); const box = $('#suggest');
 inp.addEventListener('input', () => {
 clearTimeout(searchTimer);
 const q = inp.value.trim();
 if (q.length < 1) { box.classList.add('hide'); return; }
 if (!can('view_employees')) { box.classList.add('hide'); return; }
 searchTimer = setTimeout(async () => {
 try {
 const r = await api('/api/employees?q=' + encodeURIComponent(q) + (App.filters.period ? '&period=' + App.filters.period : ''));
 if (r.empty || !r.employees.length) { box.innerHTML = '<div class="suggest-item">لا نتائج</div>'; box.classList.remove('hide'); return; }
 box.innerHTML = r.employees.slice(0, 8).map((e) => `<div class="suggest-item" data-code="${fmt.esc(e.employee_code)}"><span class="code">${fmt.esc(e.employee_code)}</span><div><div style="font-weight:700">${fmt.esc(e.arabic_name || e.name)}</div><div style="font-size:11px;color:var(--muted)">${fmt.esc(e.position || '')} · ${fmt.esc(e.section || '')}</div></div></div>`).join('') + (r.total > 8 ? `<div class="suggest-item" style="justify-content:center;color:var(--muted)">+${r.total - 8} نتيجة أخرى — اضغط Enter</div>` : '');
 box.classList.remove('hide');
 $$('.suggest-item[data-code]', box).forEach((it) => it.addEventListener('click', () => { box.classList.add('hide'); inp.value = ''; location.hash = '#/employee/' + it.dataset.code; }));
 } catch (e) {}
 }, 200);
 });
 inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); box.classList.add('hide'); if (can('view_employees')) location.hash = '#/employees?q=' + encodeURIComponent(inp.value.trim()); } });
 document.addEventListener('click', (e) => { if (!e.target.closest('.search-box')) box.classList.add('hide'); });
 }

 // ---------- Topbar ----------
 function initTopbar() {
 $('#menuBtn').addEventListener('click', () => {
 const sb = $('#sidebar'); sb.classList.toggle('open');
 if (sb.classList.contains('open')) { const bd = document.createElement('div'); bd.className = 'sidebar-backdrop'; bd.addEventListener('click', () => { sb.classList.remove('open'); bd.remove(); }); document.body.appendChild(bd); }
 else $('.sidebar-backdrop')?.remove();
 });
 $('#userBtn').addEventListener('click', (e) => { e.stopPropagation(); $('#userMenu').classList.toggle('hide'); });
 document.addEventListener('click', () => $('#userMenu').classList.add('hide'));
 $('#userMenu').addEventListener('click', (e) => e.stopPropagation());
 $('#miLogout').addEventListener('click', async () => { await api('/api/logout', { method: 'POST' }); location.reload(); });
 $('#miPrint').addEventListener('click', () => { $('#userMenu').classList.add('hide'); Pages.printCurrent(); });
 $('#miReport').addEventListener('click', () => { $('#userMenu').classList.add('hide'); location.hash = '#/dashboard'; setTimeout(() => Pages.printCurrent(), 400); });
 $('#periodChip').addEventListener('click', () => openPeriodPicker());
 }
 function openPeriodPicker() {
 if (!App.state || !App.state.snapshots.length) { location.hash = '#/upload'; return; }
 const snaps = App.state.snapshots.slice().reverse();
 const m = modal(`<div class="modal-head"><h3>اختيار فترة التقرير</h3><button class="modal-close">✕</button></div><div class="modal-body"><p style="color:var(--muted);margin-top:0">اختر الملف الشهري النشط لعرض تحليلاته.</p><div class="tbl-wrap"><table class="tbl clickable"><thead><tr><th>الفترة</th><th>الملف</th><th>الموظفون</th><th>السعودة</th><th>الجودة</th></tr></thead><tbody>${snaps.map((s) => `<tr data-id="${s.id}"><td><b>${fmt.esc(s.periodLabel || s.period)}</b></td><td style="color:var(--muted)">${fmt.esc(s.fileName)}</td><td class="num">${fmt.n(s.employeeCount)}</td><td class="num">${fmt.pct(s.saudiPct)}</td><td><span class="badge ${s.qualityScore >= 90 ? 'b-ok' : s.qualityScore >= 75 ? 'b-warn' : 'b-danger'}">${fmt.pct(s.qualityScore, 1)}</span></td></tr>`).join('')}</tbody></table></div></div>`, { sm: false });
 $$('tr[data-id]', m.root).forEach((tr) => tr.addEventListener('click', async () => { await api('/api/uploads/' + tr.dataset.id + '/activate', { method: 'POST' }); App.filters.period = ''; m.close(); await loadState(); location.hash = '#/dashboard'; route(); toast('تم تفعيل الفترة', 'ok'); }));
 }

 // ---------- State ----------
 async function loadState() {
 App.state = await api('/api/state');
 // topbar
 if (App.state.active) { $('#periodLabel').textContent = App.state.active.periodLabel || App.state.active.period || '—'; }
 else $('#periodLabel').textContent = 'لا توجد بيانات';
 const q = App.state.quality;
 const chip = $('#qualityChip');
 if (q) { chip.classList.remove('hide', 'mid', 'low'); if (q.score < 75) chip.classList.add('low'); else if (q.score < 90) chip.classList.add('mid'); $('#qualityVal').textContent = q.score.toFixed(1) + '%'; }
 else chip.classList.add('hide');
 $('#sideFoot').innerHTML = App.state.active ? `الفترة النشطة<br><b style="color:#fff">${fmt.esc(App.state.active.periodLabel || '')}</b>` : 'لم تُرفع بيانات بعد';
 }
 App.loadState = loadState;
 App.reload = async () => { await loadState(); renderFilters(); route(); };

 // ---------- Login ----------
 function showLogin() { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#passcode').focus(); }
 function initLogin() {
 $('#loginForm').addEventListener('submit', async (e) => {
 e.preventDefault();
 const btn = $('#loginBtn'); const err = $('#loginErr'); err.textContent = '';
 const pass = $('#passcode').value.trim();
 if (!pass) return;
 btn.disabled = true; btn.textContent = 'جارٍ الدخول…';
 try {
 const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ passcode: pass }) });
 App.me = r.user; await boot();
 } catch (ex) {
 if (ex.body && ex.body.error === 'locked') err.textContent = `تم قفل الدخول مؤقتاً لمدة ${ex.body.lockMinutes || 15} دقيقة بعد محاولات خاطئة.`;
 else err.textContent = 'رمز الدخول غير صحيح.';
 $('#passcode').value = ''; $('#passcode').focus();
 } finally { btn.disabled = false; btn.textContent = 'تسجيل الدخول'; }
 });
 }

 async function boot() {
 $('#login').classList.add('hide'); $('#app').classList.remove('hide');
 $('#userName').textContent = App.me.name; $('#userRole').textContent = (App.me.roleLabel || '').split('—')[0];
 $('#userAv').textContent = (App.me.name || 'U').trim().charAt(0).toUpperCase();
 $('#miSession').textContent = 'جلسة: ' + App.me.username + ' · تنتهي بعد خمول 30 دقيقة';
 renderNav();
 await loadState();
 if (!location.hash) location.hash = '#/dashboard';
 route();
 }

 window.addEventListener('hashchange', route);

 // ---------- Init ----------
 async function start() {
 initLogin(); initTopbar(); initSearch();
 try { const r = await api('/api/me'); App.me = r.user; await boot(); }
 catch (e) { showLogin(); }
 }
 // wait for deferred libs
 if (document.readyState === 'complete') start(); else window.addEventListener('load', start);
})();
</script>
