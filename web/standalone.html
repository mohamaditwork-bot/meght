<title>MAYSAN HR Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* MAYSAN INT. GROUP — HR Intelligence Platform design system */
:root{
  --teal-900:#0a3f42; --teal-800:#0d5152; --teal-700:#0e5a5a; --teal-600:#12726e;
  --green-700:#15803d; --green-600:#16a34a; --green-500:#1fae4a; --green-400:#34c759;
  --brand-grad:linear-gradient(135deg,#0a3f42 0%,#0e5a5a 45%,#16a34a 100%);
  --brand-grad-soft:linear-gradient(135deg,#0e5a5a 0%,#1f9d55 100%);
  --bg:#eef1f4; --panel:#ffffff; --panel-2:#f8fafb;
  --ink:#0f1e2b; --ink-2:#334155; --muted:#6b7a8d; --line:#e4e9ee; --line-2:#eef2f5;
  --ok:#16a34a; --warn:#e0a400; --danger:#dc2626; --watch:#2563eb; --info:#0891b2;
  --shadow-sm:0 1px 2px rgba(16,30,43,.06),0 1px 3px rgba(16,30,43,.08);
  --shadow:0 4px 14px rgba(16,30,43,.08); --shadow-lg:0 12px 40px rgba(16,30,43,.14);
  --radius:16px; --radius-sm:11px; --sidebar-w:262px; --topbar-h:64px;
  --font:'Cairo','Tajawal','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);direction:rtl;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.55}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#94a3b8;background-clip:content-box}
.hide{display:none!important}

/* ---------- Login ---------- */
.login-wrap{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(1200px 600px at 80% -10%,rgba(46,204,87,.14),transparent),
  radial-gradient(900px 600px at 0% 110%,rgba(14,90,90,.18),transparent),#0a2225;z-index:60}
.login-card{width:min(420px,92vw);background:var(--panel);border-radius:24px;box-shadow:var(--shadow-lg);padding:38px 34px;text-align:center;animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.login-logo{height:78px;margin-bottom:6px}
.login-card h1{font-size:19px;margin:8px 0 2px;color:var(--teal-800)}
.login-card p{color:var(--muted);margin:0 0 24px;font-size:13px}
.pass-field{position:relative;margin-bottom:14px}
.pass-field input{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:13px;font-size:20px;text-align:center;letter-spacing:8px;font-weight:700;color:var(--ink);transition:.2s;background:var(--panel-2)}
.pass-field input:focus{outline:none;border-color:var(--green-500);box-shadow:0 0 0 4px rgba(31,174,74,.14);background:#fff}
.btn-login{width:100%;padding:14px;border:none;border-radius:13px;background:var(--brand-grad-soft);color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;transition:.2s;box-shadow:0 8px 20px rgba(22,163,74,.28)}
.btn-login:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-login:disabled{opacity:.6;transform:none;cursor:wait}
.login-err{color:var(--danger);font-size:13px;min-height:20px;margin-top:10px;font-weight:600}
.login-foot{margin-top:22px;color:var(--muted);font-size:11.5px;letter-spacing:.4px}

/* ---------- App shell ---------- */
.app{min-height:100vh}
.sidebar{background:var(--brand-grad);color:#eaf6f2;position:fixed;top:0;right:0;bottom:0;width:var(--sidebar-w);display:flex;flex-direction:column;z-index:40;box-shadow:-4px 0 24px rgba(10,34,37,.14)}
.sidebar-head{padding:18px 20px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-head img{height:40px}
.sidebar-head .brand-name{font-weight:800;font-size:14px;line-height:1.2}
.sidebar-head .brand-sub{font-size:10px;opacity:.75;letter-spacing:1px}
.nav{flex:1;overflow-y:auto;padding:10px 12px 20px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);background-clip:content-box}
.nav-group{margin-top:14px}
.nav-group-t{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;opacity:.6;padding:6px 12px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:#dff1ec;font-size:13.5px;font-weight:600;transition:.15s;margin-bottom:2px}
.nav-item .ico{width:18px;height:18px;flex:none;opacity:.92}
.nav-item:hover{background:rgba(255,255,255,.1)}
.nav-item.active{background:rgba(255,255,255,.17);color:#fff;box-shadow:inset 3px 0 0 #34c759}
.nav-item .badge{margin-inline-start:auto;background:rgba(255,255,255,.22);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700}
.sidebar-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;opacity:.8}

/* ---------- Main ---------- */
/* In RTL the inline-start edge is on the right, where the fixed sidebar sits. */
.main{margin-inline-start:var(--sidebar-w);min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:0 22px}
.menu-btn{display:none;background:none;border:none;font-size:22px;color:var(--teal-700)}
.search-box{position:relative;flex:1;max-width:440px}
.search-box input{width:100%;padding:10px 40px 10px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:13.5px;background:var(--panel-2);transition:.2s}
.search-box input:focus{outline:none;border-color:var(--green-500);background:#fff;box-shadow:0 0 0 3px rgba(31,174,74,.12)}
.search-box .s-ico{position:absolute;inset-inline-end:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.suggest{position:absolute;top:calc(100% + 6px);inset-inline:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);max-height:340px;overflow:auto;z-index:50}
.suggest-item{padding:9px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.suggest-item:hover{background:var(--panel-2)}
.suggest-item .code{font-size:11px;color:var(--muted);background:var(--panel-2);border-radius:6px;padding:1px 7px;font-weight:700}
.topbar-spacer{flex:1}
.topbar-actions{display:flex;align-items:center;gap:9px}
.period-chip,.chip-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink-2);transition:.15s}
.chip-btn:hover,.period-chip:hover{border-color:var(--green-400);color:var(--teal-700)}
.quality-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:10px;font-weight:800;font-size:12.5px;color:#fff;background:var(--green-600)}
.quality-chip.mid{background:var(--warn)} .quality-chip.low{background:var(--danger)}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 6px 5px 12px;border-radius:30px;border:1.5px solid var(--line);background:#fff}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--brand-grad-soft);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.user-chip .u-name{font-size:12.5px;font-weight:700;line-height:1.1}
.user-chip .u-role{font-size:10.5px;color:var(--muted)}

/* dropdown */
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-lg);min-width:230px;padding:7px;z-index:55}
.dd-menu button,.dd-menu a{display:flex;align-items:center;gap:9px;width:100%;text-align:start;padding:9px 12px;border:none;background:none;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.dd-menu button:hover,.dd-menu a:hover{background:var(--panel-2)}
.dd-menu hr{border:none;border-top:1px solid var(--line-2);margin:5px 0}

/* ---------- Filter bar ---------- */
.filterbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:var(--topbar-h);z-index:20}
.filterbar .fl{display:flex;flex-direction:column;gap:3px}
.filterbar label{font-size:10.5px;color:var(--muted);font-weight:700;padding-inline-start:2px}
.filterbar select{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:12.5px;font-weight:600;background:var(--panel-2);color:var(--ink-2);min-width:120px}
.filterbar select:focus{outline:none;border-color:var(--green-500)}
.filter-reset{margin-inline-start:auto;padding:8px 14px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--danger)}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 22px 0}
.active-filters .af{background:var(--teal-700);color:#fff;border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.active-filters .af b{opacity:.7;font-weight:600}
.active-filters .af span{cursor:pointer;opacity:.8}

/* ---------- Content ---------- */
.content{padding:22px;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:22px;margin:0;color:var(--teal-800);font-weight:800}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px}
.page-head .ph-actions{display:flex;gap:9px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;color:var(--ink-2);transition:.15s}
.btn:hover{border-color:var(--green-400);color:var(--teal-700)}
.btn-primary{background:var(--brand-grad-soft);color:#fff;border:none;box-shadow:0 6px 16px rgba(22,163,74,.24)}
.btn-primary:hover{filter:brightness(1.06);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}

/* KPI grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);transition:.2s}
.kpi:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--brand-grad-soft)}
.kpi .k-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi .k-label{font-size:12px;color:var(--muted);font-weight:700}
.kpi .k-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(18,114,110,.1);color:var(--teal-700)}
.kpi .k-val{font-size:29px;font-weight:800;color:var(--ink);margin-top:8px;letter-spacing:-.5px;line-height:1}
.kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center}
.kpi .k-delta{font-weight:800;font-size:11.5px}
.kpi .up{color:var(--ok)} .kpi .down{color:var(--danger)}
.kpi.accent-green::before{background:linear-gradient(180deg,#22c55e,#15803d)}
.kpi.accent-teal::before{background:linear-gradient(180deg,#12726e,#0a3f42)}
.kpi.accent-amber::before{background:linear-gradient(180deg,#f59e0b,#b45309)}
.kpi.accent-red::before{background:linear-gradient(180deg,#ef4444,#b91c1c)}
.kpi.accent-blue::before{background:linear-gradient(180deg,#3b82f6,#1d4ed8)}

/* Panels & grid */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)} .g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.col-span-2{grid-column:span 2}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column}
.panel-head{padding:15px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-head h3{margin:0;font-size:15px;font-weight:800;color:var(--teal-800)}
.panel-head .p-sub{font-size:11.5px;color:var(--muted);font-weight:600}
.panel-body{padding:8px 18px 18px;flex:1}
.chart{width:100%;height:300px}
.chart.sm{height:240px} .chart.lg{height:380px}

/* Tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:start;padding:10px 12px;color:var(--muted);font-weight:700;font-size:11.5px;border-bottom:2px solid var(--line);white-space:nowrap;position:sticky;top:0;background:#fff}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
table.tbl tr:hover td{background:var(--panel-2)}
table.tbl.clickable tr{cursor:pointer}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}

/* Badges & bars */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-ok{background:rgba(22,163,74,.12);color:var(--green-700)}
.b-warn{background:rgba(224,164,0,.15);color:#a16207}
.b-danger{background:rgba(220,38,38,.12);color:var(--danger)}
.b-watch{background:rgba(37,99,235,.12);color:var(--watch)}
.b-muted{background:#eef2f5;color:var(--muted)}
.b-teal{background:rgba(18,114,110,.12);color:var(--teal-700)}
.bar{height:8px;background:var(--line-2);border-radius:6px;overflow:hidden;min-width:80px}
.bar > i{display:block;height:100%;border-radius:6px;background:var(--brand-grad-soft)}
.bar.red > i{background:linear-gradient(90deg,#ef4444,#b91c1c)}
.bar.amber > i{background:linear-gradient(90deg,#f59e0b,#d97706)}
.progress-ring{--sz:96px}

/* Section KPIs inline */
.mini-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mini-kpi{background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px}
.mini-kpi .m-l{font-size:11px;color:var(--muted);font-weight:700}
.mini-kpi .m-v{font-size:19px;font-weight:800;color:var(--ink);margin-top:3px}

/* Empty & loading */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty svg{width:70px;height:70px;opacity:.5;margin-bottom:14px}
.empty h3{color:var(--ink-2);margin:0 0 6px}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--green-500);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,#eef2f5 25%,#e2e8ee 37%,#eef2f5 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* Insights */
.insight{display:flex;gap:12px;padding:13px 15px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;background:#fff;align-items:flex-start}
.insight .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.insight.critical{border-inline-start:4px solid var(--danger)} .insight.critical .dot{background:var(--danger)}
.insight.high{border-inline-start:4px solid #f59e0b} .insight.high .dot{background:#f59e0b}
.insight.medium{border-inline-start:4px solid var(--watch)} .insight.medium .dot{background:var(--watch)}
.insight.low{border-inline-start:4px solid var(--muted)} .insight.low .dot{background:var(--muted)}
.insight .i-t{font-weight:800;font-size:13.5px;color:var(--ink)}
.insight .i-d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.insight .i-cat{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* Exec summary */
.exec{background:linear-gradient(135deg,#0a3f42,#0e5a5a);color:#eaf6f2;border-radius:var(--radius);padding:22px;position:relative;overflow:hidden}
.exec::after{content:"";position:absolute;left:-40px;bottom:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(46,204,87,.35),transparent 70%)}
.exec h3{margin:0 0 4px;font-size:17px}
.exec .es-item{position:relative;z-index:1;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.exec .es-item:last-child{border:none}
.exec .es-t{font-weight:800;font-size:13px;color:#9ff0c4}
.exec .es-x{font-size:13px;opacity:.95;margin-top:2px}
.exec ul{margin:6px 0 0;padding-inline-start:18px}
.exec li{margin:3px 0;font-size:12.5px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,30,32,.55);backdrop-filter:blur(3px);z-index:70;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);width:min(920px,96vw);max-height:92vh;overflow:auto;animation:pop .3s ease}
.modal.sm{width:min(520px,96vw)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}
.modal-head h3{margin:0;font-size:17px;color:var(--teal-800)}
.modal-close{border:none;background:var(--panel-2);width:34px;height:34px;border-radius:10px;font-size:18px;color:var(--muted)}
.modal-body{padding:20px 22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;font-family:inherit;background:var(--panel-2)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green-500);background:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* Employee 360 */
.emp-hero{display:flex;gap:18px;align-items:center;padding:20px 22px;background:var(--brand-grad);color:#fff;border-radius:16px;margin-bottom:18px;flex-wrap:wrap}
.emp-hero .e-av{width:66px;height:66px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:26px;font-weight:800}
.emp-hero .e-name{font-size:20px;font-weight:800}
.emp-hero .e-meta{opacity:.9;font-size:13px;margin-top:3px}
.emp-hero .e-tags{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.emp-hero .e-tags .t{background:rgba(255,255,255,.2);border-radius:20px;padding:3px 12px;font-size:11.5px;font-weight:700}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.info-cell{background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px}
.info-cell .l{font-size:11px;color:var(--muted);font-weight:700}
.info-cell .v{font-size:14px;font-weight:700;color:var(--ink);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* Timeline */
.timeline{position:relative;padding-inline-start:22px;margin-top:6px}
.timeline::before{content:"";position:absolute;inset-inline-start:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px}
.tl-item .tl-dot{position:absolute;inset-inline-start:-20px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--green-500);border:2px solid #fff;box-shadow:0 0 0 2px var(--green-500)}
.tl-item.type-salary .tl-dot{background:#f59e0b;box-shadow:0 0 0 2px #f59e0b}
.tl-item.type-position .tl-dot{background:var(--watch);box-shadow:0 0 0 2px var(--watch)}
.tl-item.type-joined .tl-dot{background:var(--teal-700);box-shadow:0 0 0 2px var(--teal-700)}
.tl-date{font-size:11.5px;color:var(--muted);font-weight:700}
.tl-title{font-weight:800;font-size:13.5px;color:var(--ink)}
.tl-detail{font-size:12.5px;color:var(--ink-2)}

/* Upload wizard */
.dropzone{border:2.5px dashed var(--line);border-radius:18px;padding:44px;text-align:center;background:var(--panel-2);transition:.2s;cursor:pointer}
.dropzone.drag{border-color:var(--green-500);background:rgba(31,174,74,.06)}
.dropzone svg{width:56px;height:56px;color:var(--teal-600);opacity:.8;margin-bottom:12px}
.dropzone h3{margin:0 0 4px;color:var(--teal-800)}
.dropzone p{margin:0;color:var(--muted);font-size:13px}
.steps{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.step{flex:1;min-width:120px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:9px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.step.active{border-color:var(--green-500);color:var(--teal-800)} .step.active .n{background:var(--green-600);color:#fff}
.step.done .n{background:var(--teal-700);color:#fff} .step.done{color:var(--teal-700)}
.map-row{display:grid;grid-template-columns:1.3fr auto 1.3fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line-2)}
.map-row .col-name{font-weight:700;font-size:13px}
.map-row select{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:12.5px;background:var(--panel-2);width:100%}
.conf{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px}
.conf.confirmed{background:rgba(22,163,74,.14);color:var(--green-700)}
.conf.high{background:rgba(37,99,235,.12);color:var(--watch)}
.conf.review{background:rgba(224,164,0,.16);color:#a16207}
.conf.dynamic{background:rgba(18,114,110,.12);color:var(--teal-700)}

/* Waterfall legend etc */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:600}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .sw{width:12px;height:12px;border-radius:4px}

/* Toast */
.toast-wrap{position:fixed;bottom:22px;inset-inline-start:22px;z-index:90;display:flex;flex-direction:column;gap:10px}
.toast{background:#0f1e2b;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;animation:pop .3s ease;max-width:360px}
.toast.ok{background:var(--green-700)} .toast.err{background:var(--danger)}

/* Compliance matrix */
.matrix{display:grid;gap:2px;font-size:12px}
.mx-cell{padding:9px 8px;text-align:center;border-radius:8px;font-weight:700}
.mx-head{background:var(--panel-2);color:var(--muted);font-size:11px}
.mx-row-label{text-align:start;font-weight:800;color:var(--ink-2);background:var(--panel-2);padding:9px 12px;border-radius:8px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 15px;border:none;background:none;font-weight:700;font-size:13px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--teal-700);border-color:var(--green-500)}

.data-note{background:rgba(224,164,0,.08);border:1px solid rgba(224,164,0,.3);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#8a6400;font-weight:600;display:flex;gap:8px;align-items:flex-start;margin-bottom:14px}

    amber: '#e0a400', red: '#dc2626', blue: '#2563eb', ink: '#0f1e2b', muted: '#6b7a8d', line: '#e4e9ee',
  };
  // Categorical palette — distinct, on-brand, colour-blind aware ordering.
  const CATS = ['#0e5a5a', '#16a34a', '#2563eb', '#e0a400', '#0891b2', '#7c3aed', '#dc2626',
    '#0d9488', '#65a30d', '#db2777', '#475569', '#f59e0b', '#059669', '#4f46e5'];
  const FONT = "'Cairo','Tajawal',sans-serif";
  const registry = new Map();

  function baseTextStyle() { return { fontFamily: FONT, color: BRAND.ink }; }
  function tooltip(extra = {}) {
    return Object.assign({
      backgroundColor: 'rgba(15,30,43,.94)', borderWidth: 0, borderRadius: 10,
      padding: [9, 13], textStyle: { color: '#fff', fontFamily: FONT, fontSize: 12.5 },
      extraCssText: 'box-shadow:0 8px 30px rgba(0,0,0,.25);',
    }, extra);
  }
  function fmtN(n) { return (n == null || isNaN(n)) ? '—' : Number(n).toLocaleString('en-US'); }

  function init(el) {
    if (!el) return null;
    if (registry.has(el)) { registry.get(el).dispose(); }
    const c = echarts.init(el, null, { renderer: 'canvas' });
    registry.set(el, c);
    return c;
  }
  function render(el, option) {
    const c = init(el); if (!c) return null;
    c.setOption(option, true);
    return c;
  }
  window.addEventListener('resize', () => { registry.forEach((c) => { try { c.resize(); } catch (e) {} }); });
  function resizeAll() { registry.forEach((c) => { try { c.resize(); } catch (e) {} }); }
  function disposeAll() { registry.forEach((c) => { try { c.dispose(); } catch (e) {} }); registry.clear(); }

  // Donut
  function donut(el, data, opts = {}) {
    const total = data.reduce((a, d) => a + d.value, 0);
    return render(el, {
      textStyle: baseTextStyle(), color: opts.colors || CATS,
      tooltip: tooltip({ trigger: 'item', formatter: (p) => `${p.name}<br><b>${fmtN(p.value)}</b> (${p.percent}%)` }),
      legend: { type: 'scroll', bottom: 0, textStyle: { fontFamily: FONT, fontSize: 11.5, color: BRAND.muted }, itemWidth: 11, itemHeight: 11, icon: 'roundRect' },
      series: [{
        type: 'pie', radius: ['52%', '76%'], center: ['50%', '44%'], avoidLabelOverlap: true,
        itemStyle: { borderColor: '#fff', borderWidth: 2, borderRadius: 4 },
        label: { show: !!opts.centerLabel, position: 'center', formatter: opts.centerLabel || '', fontFamily: FONT, fontSize: 22, fontWeight: 800, color: BRAND.ink },
        emphasis: { scale: true, scaleSize: 6, label: { show: !!opts.centerLabel } },
        labelLine: { show: false }, data,
      }],
      graphic: opts.center ? [{ type: 'text', left: 'center', top: '38%', style: { text: opts.center, textAlign: 'center', fill: BRAND.ink, fontSize: 24, fontWeight: 800, fontFamily: FONT } },
        { type: 'text', left: 'center', top: '50%', style: { text: opts.centerSub || '', textAlign: 'center', fill: BRAND.muted, fontSize: 11, fontFamily: FONT } }] : [],
    });
  }

  // Horizontal bar
  function barH(el, cats, values, opts = {}) {
    return render(el, {
      textStyle: baseTextStyle(),
      grid: { left: opts.left || 8, right: 24, top: 12, bottom: 8, containLabel: true },
      tooltip: tooltip({ trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: (p) => `${p[0].name}<br><b>${fmtN(p[0].value)}</b>${opts.suffix || ''}` }),
      xAxis: { type: 'value', axisLabel: { color: BRAND.muted, fontFamily: FONT }, splitLine: { lineStyle: { color: BRAND.line } } },
      yAxis: { type: 'category', data: cats, inverse: true, axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 11.5, width: opts.labelWidth || 120, overflow: 'truncate' }, axisTick: { show: false }, axisLine: { show: false } },
      series: [{
        type: 'bar', data: values, barMaxWidth: 22, barCategoryGap: '35%',
        itemStyle: { borderRadius: [0, 6, 6, 0], color: opts.color || new echarts.graphic.LinearGradient(0, 0, 1, 0, [{ offset: 0, color: '#0e5a5a' }, { offset: 1, color: '#1fae4a' }]) },
        label: opts.showLabel ? { show: true, position: 'right', formatter: (p) => fmtN(p.value) + (opts.suffix || ''), fontFamily: FONT, color: BRAND.ink_2 || BRAND.muted, fontWeight: 700, fontSize: 11 } : { show: false },
      }],
    });
  }

  // Vertical bar
  function barV(el, cats, values, opts = {}) {
    return render(el, {
      textStyle: baseTextStyle(), color: opts.colors || CATS,
      grid: { left: 8, right: 12, top: 18, bottom: 8, containLabel: true },
      tooltip: tooltip({ trigger: 'axis', axisPointer: { type: 'shadow' } }),
      xAxis: { type: 'category', data: cats, axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 11, interval: 0, rotate: opts.rotate || 0 }, axisTick: { show: false } },
      yAxis: { type: 'value', axisLabel: { color: BRAND.muted, fontFamily: FONT }, splitLine: { lineStyle: { color: BRAND.line } } },
      series: [{ type: 'bar', data: values, barMaxWidth: 34, itemStyle: { borderRadius: [6, 6, 0, 0], color: opts.color || new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: '#1fae4a' }, { offset: 1, color: '#0e5a5a' }]) } }],
    });
  }

  // Stacked bar (Saudi vs non-Saudi etc.)
  function stacked(el, cats, series, opts = {}) {
    return render(el, {
      textStyle: baseTextStyle(),
      grid: { left: 8, right: 16, top: 30, bottom: 8, containLabel: true },
      tooltip: tooltip({ trigger: 'axis', axisPointer: { type: 'shadow' } }),
      legend: { top: 0, textStyle: { fontFamily: FONT, color: BRAND.muted, fontSize: 11.5 }, itemWidth: 12, itemHeight: 12, icon: 'roundRect' },
      xAxis: opts.horizontal ? { type: 'value', axisLabel: { color: BRAND.muted, fontFamily: FONT }, splitLine: { lineStyle: { color: BRAND.line } } } : { type: 'category', data: cats, axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 11, interval: 0, rotate: opts.rotate || 0 } },
      yAxis: opts.horizontal ? { type: 'category', data: cats, inverse: true, axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 11.5, width: opts.labelWidth || 110, overflow: 'truncate' } } : { type: 'value', axisLabel: { color: BRAND.muted, fontFamily: FONT }, splitLine: { lineStyle: { color: BRAND.line } } },
      series: series.map((s, i) => ({
        name: s.name, type: 'bar', stack: 'total', data: s.data, barMaxWidth: 26,
        itemStyle: { color: s.color || CATS[i], borderRadius: i === series.length - 1 ? (opts.horizontal ? [0, 5, 5, 0] : [5, 5, 0, 0]) : 0 },
      })),
    });
  }

  // Treemap
  function treemap(el, data) {
    return render(el, {
      textStyle: baseTextStyle(),
      tooltip: tooltip({ formatter: (p) => `${p.name}<br><b>${fmtN(p.value)}</b>` }),
      series: [{
        type: 'treemap', roam: false, nodeClick: false, breadcrumb: { show: false },
        data, width: '100%', height: '100%', top: 4, bottom: 4, left: 4, right: 4,
        label: { fontFamily: FONT, fontSize: 12, fontWeight: 700, color: '#fff', formatter: (p) => `${p.name}\n${fmtN(p.value)}` },
        itemStyle: { borderColor: '#fff', borderWidth: 2, gapWidth: 2 },
        levels: [{ color: CATS, colorMappingBy: 'index' }],
      }],
    });
  }

  // Line / trend
  function line(el, cats, series, opts = {}) {
    return render(el, {
      textStyle: baseTextStyle(), color: opts.colors || CATS,
      grid: { left: 8, right: 18, top: 24, bottom: 8, containLabel: true },
      tooltip: tooltip({ trigger: 'axis' }),
      legend: series.length > 1 ? { top: 0, textStyle: { fontFamily: FONT, color: BRAND.muted, fontSize: 11.5 } } : undefined,
      xAxis: { type: 'category', data: cats, boundaryGap: false, axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 11 } },
      yAxis: { type: 'value', axisLabel: { color: BRAND.muted, fontFamily: FONT }, splitLine: { lineStyle: { color: BRAND.line } } },
      series: series.map((s, i) => ({
        name: s.name, type: 'line', smooth: true, data: s.data, symbol: 'circle', symbolSize: 7,
        lineStyle: { width: 3 }, areaStyle: opts.area ? { opacity: .12 } : undefined,
      })),
    });
  }

  // Waterfall (workforce movement)
  function waterfall(el, items) {
    // items: [{name, value, type:'total'|'inc'|'dec'}]
    let running = 0; const base = [], up = [], down = [], tot = [];
    items.forEach((it) => {
      if (it.type === 'total') { base.push('-'); up.push('-'); down.push('-'); tot.push(it.value); running = it.value; }
      else if (it.value >= 0) { base.push(running); up.push(it.value); down.push('-'); tot.push('-'); running += it.value; }
      else { running += it.value; base.push(running); up.push('-'); down.push(-it.value); tot.push('-'); }
    });
    return render(el, {
      textStyle: baseTextStyle(),
      grid: { left: 8, right: 16, top: 20, bottom: 8, containLabel: true },
      tooltip: tooltip({ trigger: 'axis', axisPointer: { type: 'shadow' }, formatter: (p) => { const it = items[p[0].dataIndex]; return `${it.name}<br><b>${fmtN(it.value)}</b>`; } }),
      xAxis: { type: 'category', data: items.map((i) => i.name), axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 10.5, interval: 0, rotate: 22 } },
      yAxis: { type: 'value', axisLabel: { color: BRAND.muted, fontFamily: FONT }, splitLine: { lineStyle: { color: BRAND.line } } },
      series: [
        { type: 'bar', stack: 'w', itemStyle: { color: 'transparent' }, data: base },
        { type: 'bar', stack: 'w', data: up, itemStyle: { color: '#16a34a', borderRadius: [4, 4, 0, 0] }, barMaxWidth: 34, label: { show: true, position: 'top', formatter: (p) => p.value === '-' ? '' : '+' + fmtN(p.value), fontFamily: FONT, fontSize: 10, color: '#15803d', fontWeight: 700 } },
        { type: 'bar', stack: 'w', data: down, itemStyle: { color: '#dc2626', borderRadius: [4, 4, 0, 0] }, barMaxWidth: 34, label: { show: true, position: 'top', formatter: (p) => p.value === '-' ? '' : '−' + fmtN(p.value), fontFamily: FONT, fontSize: 10, color: '#b91c1c', fontWeight: 700 } },
        { type: 'bar', stack: 'w', data: tot, itemStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: '#0e5a5a' }, { offset: 1, color: '#0a3f42' }]), borderRadius: [4, 4, 0, 0] }, barMaxWidth: 34, label: { show: true, position: 'top', formatter: (p) => p.value === '-' ? '' : fmtN(p.value), fontFamily: FONT, fontSize: 11, color: BRAND.ink, fontWeight: 800 } },
      ],
    });
  }

  // Heatmap (nationality x section)
  function heatmap(el, rows, cols, data, opts = {}) {
    const max = Math.max(1, ...data.map((d) => d[2]));
    return render(el, {
      textStyle: baseTextStyle(),
      tooltip: tooltip({ formatter: (p) => `${cols[p.value[0]]} · ${rows[p.value[1]]}<br><b>${fmtN(p.value[2])}</b>` }),
      grid: { left: 8, right: 14, top: 10, bottom: 60, containLabel: true },
      xAxis: { type: 'category', data: cols, splitArea: { show: true }, axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 10, rotate: 40, interval: 0 } },
      yAxis: { type: 'category', data: rows, splitArea: { show: true }, axisLabel: { color: BRAND.ink, fontFamily: FONT, fontSize: 10.5, width: 90, overflow: 'truncate' } },
      visualMap: { min: 0, max, calculable: true, orient: 'horizontal', left: 'center', bottom: 0, inRange: { color: ['#eef7f2', '#7fd0a1', '#16a34a', '#0a3f42'] }, textStyle: { fontFamily: FONT, color: BRAND.muted } },
      series: [{ type: 'heatmap', data, label: { show: opts.showLabel !== false, fontFamily: FONT, fontSize: 10, color: '#0f1e2b' }, itemStyle: { borderColor: '#fff', borderWidth: 1 }, emphasis: { itemStyle: { shadowBlur: 8, shadowColor: 'rgba(0,0,0,.25)' } } }],
    });
  }

  // Gauge / progress ring
  function gauge(el, value, opts = {}) {
    const color = opts.color || (value >= (opts.target || 100) ? '#16a34a' : value >= 50 ? '#e0a400' : '#dc2626');
    return render(el, {
      series: [{
        type: 'gauge', startAngle: 220, endAngle: -40, min: 0, max: 100, radius: '96%', center: ['50%', '56%'],
        progress: { show: true, width: 14, itemStyle: { color } },
        axisLine: { lineStyle: { width: 14, color: [[1, '#eef2f5']] } },
        pointer: { show: false }, axisTick: { show: false }, splitLine: { show: false }, axisLabel: { show: false },
        anchor: { show: false }, title: { show: false },
        detail: { valueAnimation: true, formatter: (v) => (opts.pct ? v.toFixed(opts.dec ?? 1) + '%' : v.toFixed(0)), fontFamily: FONT, fontSize: 26, fontWeight: 800, color: BRAND.ink, offsetCenter: [0, 0] },
        data: [{ value }],
      }],
    });
  }

  window.Chart = { render, donut, barH, barV, stacked, treemap, line, waterfall, heatmap, gauge, resizeAll, disposeAll, CATS, BRAND, fmtN };
})();
</script>
<script>/* pages.js — all dashboard/page renderers. */
(function () {
  const api = (p, o) => App.api(p, o);
  const qs = (e) => App.qs(e);
  const el = (id) => document.getElementById(id);
  const afterPaint = (fn) => requestAnimationFrame(() => requestAnimationFrame(fn));
  const Pages = {};
  window.Pages = Pages;

  // ---------- shared UI ----------
  function kpi(o) {
    const delta = o.delta != null ? `<span class="k-delta ${o.delta >= 0 ? 'up' : 'down'}">${o.delta >= 0 ? '▲' : '▼'} ${fmt.n(Math.abs(o.delta), o.deltaDec || 0)}${o.deltaSuffix || ''}</span>` : '';
    return `<div class="kpi ${o.accent ? 'accent-' + o.accent : ''}">
      <div class="k-top"><span class="k-label">${o.label}</span>${o.ico ? `<span class="k-ico">${o.ico}</span>` : ''}</div>
      <div class="k-val">${o.value}</div>
      <div class="k-sub">${delta}${o.sub || ''}</div></div>`;
  }
  function panel(title, bodyId, opts = {}) {
    return `<div class="panel ${opts.cls || ''}"><div class="panel-head"><h3>${title}</h3>${opts.sub ? `<span class="p-sub">${opts.sub}</span>` : ''}${opts.action || ''}</div><div class="panel-body">${opts.body || `<div id="${bodyId}" class="chart ${opts.chartCls || ''}"></div>`}</div></div>`;
  }
  function emptyState() {
    return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      <h3>لا توجد بيانات بعد</h3><p>ابدأ برفع أول ملف Excel شهري لتفعيل جميع التحليلات والمؤشرات.</p>
      ${can('upload_data') ? '<a href="#/upload" class="btn btn-primary" style="margin-top:14px">⬆️ رفع ملف Excel</a>' : '<p style="margin-top:10px">تواصل مع مدير الموارد البشرية لرفع البيانات.</p>'}</div>`;
  }
  function head(title, sub, actions) {
    return `<div class="page-head"><div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="ph-actions no-print">${actions || ''}</div></div>`;
  }
  function printBtn() { return `<button class="btn" onclick="Pages.printCurrent()">🖨️ طباعة</button>`; }
  function excelBtn(fn) { return `<button class="btn" data-excel="${fn}">📊 تصدير Excel</button>`; }

  // Print chrome (logo header + footer), only visible when printing.
  function printChrome(title) {
    const s = App.state;
    const now = new Date();
    const filters = Object.entries(App.filters).filter(([k, v]) => v).map(([k, v]) => {
      const L = { period: 'الفترة', division: 'المنشأة', department: 'القسم', position: 'المسمى', nationality: 'الجنسية', level: 'الدرجة', gender: 'الجنس', saudi: 'التصنيف' }[k] || k;
      let dv = v; if (k === 'period') { const sn = (s.snapshots || []).find((x) => x.id === v); dv = sn ? sn.periodLabel : v; }
      return `${L}: ${dv}`;
    }).join(' · ') || 'لا يوجد';
    const period = s.active ? (s.active.periodLabel || s.active.period) : '—';
    return `<div class="print-header">
      <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20640%20300%22%20role%3D%22img%22%20aria-label%3D%22MAYSAN%20INT.%20GROUP%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22mgTeal%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%230a3f42%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23137a5e%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22mgGreen%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%231f9d47%22%2F%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%232ecc57%22%2F%3E%0A%20%20%20%20%3C%2FlinearGradient%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3C!--%20Large%20serif%20MG%20monogram%20(M%20teal-%3Egreen%2C%20G%20green)%2C%20overlapping%20--%3E%0A%20%20%3Cg%20font-family%3D%22Georgia%2C%27Times%20New%20Roman%27%2Cserif%22%20font-weight%3D%22700%22%20font-size%3D%22300%22%20text-anchor%3D%22middle%22%3E%0A%20%20%20%20%3Ctext%20x%3D%22238%22%20y%3D%22232%22%20fill%3D%22url(%23mgTeal)%22%3EM%3C%2Ftext%3E%0A%20%20%20%20%3Ctext%20x%3D%22430%22%20y%3D%22232%22%20fill%3D%22url(%23mgGreen)%22%3EG%3C%2Ftext%3E%0A%20%20%3C%2Fg%3E%0A%20%20%3C!--%20Wordmark%20band%20%2B%20text%20across%20the%20middle%20--%3E%0A%20%20%3Crect%20x%3D%2224%22%20y%3D%22128%22%20width%3D%22592%22%20height%3D%2246%22%20rx%3D%226%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.82%22%2F%3E%0A%20%20%3Cg%20font-family%3D%22%27Cairo%27%2C%27Segoe%20UI%27%2CArial%2Csans-serif%22%20font-weight%3D%22800%22%20font-size%3D%2230%22%20letter-spacing%3D%227%22%20text-anchor%3D%22middle%22%3E%0A%20%20%20%20%3Ctext%20x%3D%22188%22%20y%3D%22162%22%20fill%3D%22%2312726e%22%3EMAYSAN%3C%2Ftext%3E%0A%20%20%20%20%3Ctext%20x%3D%22330%22%20y%3D%22162%22%20fill%3D%22%230a3f42%22%3EINT.%3C%2Ftext%3E%0A%20%20%20%20%3Ctext%20x%3D%22452%22%20y%3D%22162%22%20fill%3D%22%231f9d47%22%3EGROUP%3C%2Ftext%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E%0A" alt="MAYSAN INT. GROUP">
      <div class="pr-title"><h1>${title}</h1>
        <div class="pr-meta">مجموعة ميسان الدولية · تقرير الموارد البشرية<br>
        الفترة: ${period} · الفلاتر: ${fmt.esc(filters)}<br>
        آخر تحديث للبيانات: ${s.active ? fmt.date(s.active.asOf) : '—'} · تاريخ الإصدار: ${now.toLocaleDateString('ar-EG')} ${now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}</div>
      </div></div>`;
  }
  function printFooter() {
    return `<div class="print-footer"><span>MAYSAN INT. GROUP — HR Intelligence Platform</span><span>وثيقة سرّية · للاستخدام الداخلي فقط</span></div>`;
  }
  Pages.printCurrent = function () {
    const c = el('content');
    if (!c.querySelector('.print-header')) {
      const title = c.querySelector('.page-head h2')?.textContent || 'تقرير الموارد البشرية';
      c.insertAdjacentHTML('afterbegin', printChrome(title));
      c.insertAdjacentHTML('beforeend', printFooter());
    }
    Chart.resizeAll();
    setTimeout(() => window.print(), 250);
  };
  function bindExcel(root, dataFn) {
    root.querySelectorAll('[data-excel]').forEach((b) => b.addEventListener('click', () => dataFn(b.dataset.excel)));
  }
  function exportRows(rows, sheet, file) {
    if (!window.XLSX) { toast('مكتبة التصدير غير جاهزة', 'err'); return; }
    const ws = XLSX.utils.json_to_sheet(rows); const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheet.slice(0, 30)); XLSX.writeFile(wb, file);
    toast('تم تصدير الملف', 'ok');
  }
  Pages.exportRows = exportRows;

  function complianceStatus(days) {
    if (days == null) return '<span class="badge b-muted">غير متوفر</span>';
    if (days < 0) return '<span class="badge b-danger">منتهية</span>';
    if (days <= 30) return '<span class="badge b-warn">تنتهي قريباً</span>';
    if (days <= 90) return '<span class="badge b-watch">قيد المتابعة</span>';
    return '<span class="badge b-ok">سارية</span>';
  }

  function noData(content) { content.innerHTML = head('لا توجد بيانات') + emptyState(); }

  // ========== DASHBOARD ==========
  Pages.dashboard = async function (content) {
    const st = App.state;
    if (!st.hasData) return noData(content);
    const [k, sum, wf] = await Promise.all([
      api('/api/kpis' + qs()), api('/api/summary' + qs()),
      can('view_workforce') ? api('/api/workforce' + qs()) : Promise.resolve(null),

    content.innerHTML = head('مركز الانتهاء والامتثال', 'مراقبة العقود والوثائق والإقامات — الخانة الفارغة تُصنّف «غير متوفرة» وليست «سارية»', printBtn()) +
      `<div class="kpi-grid">
        ${kpi({ label: 'تنبيهات حرجة', value: fmt.n(byPr.critical), accent: 'red', ico: '🔴', sub: 'منتهية أو ≤7 أيام' })}
        ${kpi({ label: 'عالية', value: fmt.n(byPr.high), accent: 'amber', ico: '🟠', sub: '≤30 يوم' })}
        ${kpi({ label: 'متوسطة', value: fmt.n(byPr.medium), accent: 'blue', ico: '🔵', sub: '≤60 يوم' })}
        ${kpi({ label: 'منخفضة', value: fmt.n(byPr.low), accent: 'teal', ico: '🟢', sub: '≤90 يوم' })}
      </div>
      <div class="panel" style="margin-bottom:16px"><div class="panel-head"><h3>مصفوفة الامتثال حسب الوثيقة</h3></div><div class="panel-body tbl-wrap">
        <table class="tbl"><thead><tr><th>الوثيقة</th>${bucketKeys.map((b) => `<th style="text-align:center">${bucketLabels[b]}</th>`).join('')}</tr></thead><tbody>
        ${r.fields.map((f) => { const c = r.matrix[f.key].counts; return `<tr><td><b>${fmt.esc(f.label)}</b></td>${bucketKeys.map((b) => `<td style="text-align:center"><span class="mx-cell" style="background:${hexA(bucketColors[b], .13)};color:${bucketColors[b]}">${fmt.n(c[b])}</span></td>`).join('')}</tr>`; }).join('')}
        </tbody></table></div></div>
      <div class="grid g-2">${panel('توزيع حالات الوثائق', 'chExpStack', { chartCls: 'lg' })}<div class="panel"><div class="panel-head"><h3>بيانات ناقصة</h3><span class="p-sub">لا تُفترض «سارية»</span></div><div class="panel-body"><div id="chMissing" class="chart lg"></div></div></div></div>
      <div class="panel" style="margin-top:16px"><div class="panel-head"><h3>التنبيهات الذكية (خلال 90 يوم أو منتهية)</h3><span class="p-sub">${fmt.n(alerts.length)} تنبيه</span>${excelBtn('alerts')}</div><div class="panel-body tbl-wrap">
        <table class="tbl clickable responsive-cards"><thead><tr><th>الأولوية</th><th>الموظف</th><th>القسم</th><th>الوثيقة</th><th>تاريخ الانتهاء</th><th>المتبقي</th></tr></thead><tbody>
        ${alerts.slice(0, 200).map((x) => `<tr data-code="${fmt.esc(x.employee_code)}"><td data-l="الأولوية"><span class="badge ${prBadge(x.priority)}">${prLabel(x.priority)}</span></td><td data-l="الموظف">${fmt.esc(x.arabic_name || x.name)} <span style="color:var(--muted);font-size:11px">${fmt.esc(x.employee_code)}</span></td><td data-l="القسم">${fmt.esc(x.section)}</td><td data-l="الوثيقة">${fmt.esc(x.document_ar)}</td><td data-l="الانتهاء">${fmt.date(x.expiry_date)}</td><td data-l="المتبقي" class="num">${x.days_left < 0 ? 'منتهية منذ ' + Math.abs(x.days_left) + ' يوم' : x.days_left + ' يوم'}</td></tr>`).join('')}
        </tbody></table></div></div>`;
    afterPaint(() => {
      Chart.stacked(el('chExpStack'), r.fields.map((f) => f.label), bucketKeys.map((b) => ({ name: bucketLabels[b], data: r.fields.map((f) => r.matrix[f.key].counts[b]), color: bucketColors[b] })));

    });

  function infoCell(l, v) { return `<div class="info-cell"><div class="l">${l}</div><div class="v">${v == null || v === '' ? '<span class="badge b-muted">غير متوفر</span>' : fmt.esc(v)}</div></div>`; }

  // ========== MOVEMENTS ==========
  Pages.movements = async function (content) {
    if (!App.state.hasData) return noData(content);
    const r = await api('/api/movements' + (App.filters.period ? '?period=' + App.filters.period : ''));

      content.innerHTML = head('الترقيات والحركات الوظيفية', r.period || '') +

        newHiresPanel(r.newHires);
      bindEmpClicks(content); return;

    content.innerHTML = head('الترقيات والحركات الوظيفية', `${r.period} مقابل ${r.previousPeriod}`, printBtn()) +
      `<div class="kpi-grid">
        ${kpi({ label: 'ترقيات مرجّحة', value: fmt.n(r.movements.filter((m) => m.classification.type === 'Promotion').length), accent: 'green', ico: '⬆️' })}

        ${kpi({ label: 'تعيينات جديدة', value: fmt.n(r.newHires.length), accent: 'teal', ico: '🆕' })}
        ${kpi({ label: 'مفقودون من الملف', value: fmt.n(r.missing.length), accent: 'red', ico: '⚠️', sub: 'يحتاج تصنيف السبب' })}
      </div>
      <div class="tabs"><button class="tab active" data-tab="mov">الحركات (${r.movements.length})</button><button class="tab" data-tab="new">التعيينات (${r.newHires.length})</button><button class="tab" data-tab="miss">المفقودون (${r.missing.length})</button></div>
      <div id="tabMov">${movementsTable(r.movements)}</div>
      <div id="tabNew" class="hide">${newHiresPanel(r.newHires)}</div>
      <div id="tabMiss" class="hide">${missingPanel(r.missing)}</div>`;

      content.querySelectorAll('.tab').forEach((x) => x.classList.remove('active')); t.classList.add('active');
      el('tabMov').classList.toggle('hide', t.dataset.tab !== 'mov');
      el('tabNew').classList.toggle('hide', t.dataset.tab !== 'new');

  function movementsTable(movs) {
    if (!movs.length) return '<div class="empty" style="padding:40px"><p>لا توجد حركات بين الفترتين.</p></div>';
    const canSal = can('view_salary');
    return `<div class="panel"><div class="panel-body tbl-wrap"><table class="tbl clickable responsive-cards"><thead><tr><th>الموظف</th><th>القسم</th><th>التصنيف</th><th>المسمى (قبل ← بعد)</th><th>الدرجة</th>${canSal ? '<th>الراتب</th><th>الزيادة%</th>' : ''}${can('manage_movements') ? '<th>إجراء</th>' : ''}</tr></thead><tbody>
      ${movs.map((m) => { const pos = m.changes.find((c) => c.field === 'position'); const lvl = m.changes.find((c) => c.field === 'level_code'); return `<tr data-code="${fmt.esc(m.employee_code)}"><td data-l="الموظف">${fmt.esc(m.arabic_name || m.name)} <span style="color:var(--muted);font-size:11px">${fmt.esc(m.employee_code)}</span></td><td data-l="القسم">${fmt.esc(m.section)}</td><td data-l="التصنيف">${classBadge(m.classification)}</td><td data-l="المسمى">${pos ? `${fmt.esc(pos.from || '—')} <b style="color:var(--teal-700)">←</b> ${fmt.esc(pos.to)}` : '—'}</td><td data-l="الدرجة">${lvl ? `${fmt.esc(lvl.from || '—')} ← ${fmt.esc(lvl.to)}` : '—'}</td>${canSal ? `<td data-l="الراتب" class="num">${m.current.total_salary != null ? fmt.moneyPlain(m.current.total_salary) : '—'}</td><td data-l="الزيادة" class="num">${m.salary_pct != null ? (m.salary_pct >= 0 ? '+' : '') + m.salary_pct.toFixed(2) + '%' : '—'}</td>` : ''}${can('manage_movements') ? `<td data-l="إجراء" class="no-print"><button class="btn" style="padding:5px 10px" data-classify="${fmt.esc(m.employee_code)}">تصنيف</button></td>` : ''}</tr>`; }).join('')}
    </tbody></table></div></div>`;
  }
  function classBadge(c) {
    const m = { Promotion: 'b-ok', 'Salary Adjustment': 'b-warn', 'Position Change': 'b-watch', 'Level Change': 'b-watch', Transfer: 'b-teal', 'Multiple Changes': 'b-warn', 'AI Review Required': 'b-muted' };
    return `<span class="badge ${m[c.type] || 'b-muted'}">${fmt.esc(c.label)}${c.overridden ? ' ✓' : ''}</span>`;
  }
  function newHiresPanel(list) {
    if (!list.length) return '<div class="empty" style="padding:40px"><p>لا توجد تعيينات جديدة.</p></div>';
    return `<div class="panel"><div class="panel-body tbl-wrap"><table class="tbl clickable responsive-cards"><thead><tr><th>الرقم</th><th>الاسم</th><th>القسم</th><th>المسمى</th><th>تاريخ التعيين</th><th>الجنسية</th></tr></thead><tbody>${list.map((e) => `<tr data-code="${fmt.esc(e.employee_code)}"><td data-l="الرقم" class="num">${fmt.esc(e.employee_code)}</td><td data-l="الاسم">${fmt.esc(e.arabic_name || e.name)}</td><td data-l="القسم">${fmt.esc(e.section)}</td><td data-l="المسمى">${fmt.esc(e.position)}</td><td data-l="التعيين">${fmt.date(e.hiring_date)}</td><td data-l="الجنسية">${fmt.esc(e.nationality)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  function missingPanel(list) {

    <div class="panel"><div class="panel-body tbl-wrap"><table class="tbl clickable responsive-cards"><thead><tr><th>الرقم</th><th>الاسم</th><th>القسم</th><th>المسمى</th><th>السبب</th>${can('manage_leavers') ? '<th>إجراء</th>' : ''}</tr></thead><tbody>${list.map((e) => `<tr data-code="${fmt.esc(e.employee_code)}"><td data-l="الرقم" class="num">${fmt.esc(e.employee_code)}</td><td data-l="الاسم">${fmt.esc(e.arabic_name || e.name)}</td><td data-l="القسم">${fmt.esc(e.section)}</td><td data-l="المسمى">${fmt.esc(e.position)}</td><td data-l="السبب">${e.reason ? `<span class="badge b-teal">${fmt.esc(e.reason)}</span>` : '<span class="badge b-warn">بحاجة لتصنيف</span>'}</td>${can('manage_leavers') ? `<td class="no-print"><button class="btn" style="padding:5px 10px" data-leaver="${fmt.esc(e.employee_code)}">تحديد السبب</button></td>` : ''}</tr>`).join('')}</tbody></table></div></div>`;
  }
  function bindEmpClicks(root) { root.querySelectorAll('tr[data-code]').forEach((tr) => tr.addEventListener('click', () => location.hash = '#/employee/' + tr.dataset.code)); }
  function openClassify(period, code) {
    const types = [['Promotion', 'ترقية'], ['Position Change', 'تغيير مسمى'], ['Salary Adjustment', 'تعديل راتب'], ['Level Change', 'تغيير درجة'], ['Transfer', 'نقل'], ['Multiple Changes', 'تغييرات متعددة'], ['AI Review Required', 'يحتاج مراجعة']];
    const m = modal(`<div class="modal-head"><h3>تصنيف الحركة — ${fmt.esc(code)}</h3><button class="modal-close">✕</button></div><div class="modal-body"><div class="field"><label>التصنيف المعتمد من الموارد البشرية</label><select id="clsSel">${types.map((t) => `<option value="${t[0]}">${t[1]}</option>`).join('')}</select></div></div><div class="modal-foot"><button class="btn modal-close">إلغاء</button><button class="btn btn-primary" id="clsSave">اعتماد</button></div>`, { sm: true });
    el('clsSave').addEventListener('click', async () => {
      const sel = el('clsSel'); await api('/api/movement/classify', { method: 'POST', body: JSON.stringify({ period, code, type: sel.value, label: sel.options[sel.selectedIndex].text }) });
      m.close(); toast('تم اعتماد التصنيف', 'ok'); window.route();
    });
  }
  function openLeaver(code) {
    const period = App.filters.period || (App.state.active && App.state.active.id);
    const reasons = ['استقالة', 'إنهاء خدمة', 'نقل', 'انتهاء عقد', 'مشكلة في البيانات', 'أخرى'];
    const m = modal(`<div class="modal-head"><h3>سبب مغادرة الموظف — ${fmt.esc(code)}</h3><button class="modal-close">✕</button></div><div class="modal-body"><div class="field"><label>السبب</label><select id="lvSel">${reasons.map((r) => `<option>${r}</option>`).join('')}</select></div></div><div class="modal-foot"><button class="btn modal-close">إلغاء</button><button class="btn btn-primary" id="lvSave">حفظ</button></div>`, { sm: true });
    el('lvSave').addEventListener('click', async () => {
      await api('/api/leaver/reason', { method: 'POST', body: JSON.stringify({ period, code, reason: el('lvSel').value }) });
      m.close(); toast('تم حفظ السبب', 'ok'); window.route();
    });
  }

  // ========== MONTHLY MOVEMENT ==========
  Pages.monthly = async function (content) {

      `<div class="kpi-grid">

        ${kpi({ label: 'تعيينات جديدة', value: fmt.n(s.new_hires), accent: 'green', ico: '🆕' })}
        ${kpi({ label: 'مفقودون', value: fmt.n(s.missing_employees), accent: 'red', ico: '📤' })}
        ${kpi({ label: 'ترقيات', value: fmt.n(s.promotions), accent: 'blue', ico: '⬆️' })}
        ${kpi({ label: 'الختامي', value: fmt.n(s.closing_headcount), accent: 'teal', ico: '📦' })}
        ${kpi({ label: 'صافي التغير', value: (s.net_change >= 0 ? '+' : '') + fmt.n(s.net_change), accent: s.net_change >= 0 ? 'green' : 'red', ico: '📊' })}
      </div>

    afterPaint(() => {
      Chart.waterfall(el('chWaterfall'), [
        { name: 'الافتتاحي', value: s.opening_headcount, type: 'total' },
        { name: 'تعيينات', value: s.new_hires, type: 'inc' },
        { name: 'مفقودون', value: -s.missing_employees, type: 'dec' },
        { name: 'الختامي', value: s.closing_headcount, type: 'total' },
      ]);

  // ========== COMPARE ==========
  Pages.compare = async function (content) {
    if (!App.state.hasData) return noData(content);
    const snaps = App.state.snapshots;
    if (snaps.length < 2) { content.innerHTML = head('المقارنة الشهرية') + `<div class="data-note">ℹ️ المقارنة تحتاج فترتين على الأقل. ارفع ملفاً شهرياً إضافياً لتفعيلها.</div>`; return; }
    const def = { from: snaps[snaps.length - 2].id, to: snaps[snaps.length - 1].id };
    content.innerHTML = head('المقارنة الشهرية', 'قارن أي فترتين جنباً إلى جنب', printBtn()) +
      `<div class="panel" style="margin-bottom:16px"><div class="panel-body" style="display:flex;gap:14px;flex-wrap:wrap;align-items:end">
        <div class="field" style="margin:0"><label>من فترة</label><select id="cmpFrom">${snaps.map((s) => `<option value="${s.id}" ${s.id === def.from ? 'selected' : ''}>${fmt.esc(s.periodLabel || s.period)}</option>`).join('')}</select></div>
        <div class="field" style="margin:0"><label>إلى فترة</label><select id="cmpTo">${snaps.map((s) => `<option value="${s.id}" ${s.id === def.to ? 'selected' : ''}>${fmt.esc(s.periodLabel || s.period)}</option>`).join('')}</select></div>
      </div></div><div id="cmpResult"></div>`;
    const run = async () => {
      const from = el('cmpFrom').value, to = el('cmpTo').value;
      el('cmpResult').innerHTML = '<div class="spinner"></div>';
      const r = await api(`/api/compare?from=${from}&to=${to}`);
      const M = r.metrics;
      const dcard = (label, m, fmtFn, ico, accent) => { if (!m) return ''; return kpi({ label, value: fmtFn(m.to), accent, ico, sub: `<span style="color:var(--muted)">من ${fmtFn(m.from)}</span>`, delta: m.change, deltaSuffix: label.includes('%') ? '%' : '', deltaDec: label.includes('%') ? 2 : 0 }); };
      el('cmpResult').innerHTML = `<div style="color:var(--muted);font-size:13px;margin-bottom:10px">${fmt.esc(r.from.label)} ← ${fmt.esc(r.to.label)}</div><div class="kpi-grid">
        ${dcard('عدد الموظفين', M.headcount, fmt.n, '👥', 'teal')}
        ${dcard('السعوديون', M.saudi, fmt.n, '🇸🇦', 'green')}
        ${dcard('نسبة السعودة %', M.saudi_pct, (v) => fmt.pct(v), '📊', 'green')}
        ${M.payroll ? dcard('إجمالي الرواتب', M.payroll, fmt.moneyPlain, '💰', 'amber') : ''}
        ${dcard('رصيد الإجازات', M.annual_balance, (v) => fmt.n(v, 0), '🏖️', 'teal')}
        ${dcard('وثائق تنتهي', M.documents_expiring, fmt.n, '⏳', 'red')}
      </div>
      <div class="grid g-4" style="margin-top:4px">
        ${kpi({ label: 'تعيينات جديدة', value: fmt.n(r.newHires), accent: 'green', ico: '🆕' })}
        ${kpi({ label: 'مفقودون', value: fmt.n(r.missing), accent: 'red', ico: '📤' })}
        ${kpi({ label: 'ترقيات', value: fmt.n(r.promotions), accent: 'blue', ico: '⬆️' })}
        ${kpi({ label: 'تغييرات المسمى', value: fmt.n(r.positionChanges), accent: 'teal', ico: '🔄' })}
      </div>`;
    };
    el('cmpFrom').addEventListener('change', run); el('cmpTo').addEventListener('change', run); run();
  };

  // ========== RULES ==========
  Pages.rules = async function (content) {
    const r = await api('/api/rules');
    const rules = r.rules || [];
    const canManage = can('manage_localization_rules');
    content.innerHTML = head('مركز قرارات التوطين', 'المرجع الرسمي هو الأساس — لا يعتمد النظام على معلومات محفوظة داخل نموذج الذكاء الاصطناعي كمصدر قانوني', canManage ? `<button class="btn btn-primary" id="addRule">+ إضافة قرار</button>` : '') +
      `<div class="data-note">📌 لا تُخترع نسب التوطين. كل قرار يجب أن يحمل مصدراً رسمياً موثّقاً (وزارة الموارد البشرية والتنمية الاجتماعية أو الأنظمة الحكومية المعتمدة) مع رابط المصدر وتاريخ آخر تحقّق. عند غياب قرار موثّق، يعرض النظام: «تعذّر تحديد هدف التوطين الرسمي بثقة كافية».</div>` +
      (rules.length ? `<div class="grid g-2">${rules.map(ruleCard).join('')}</div>` :
        `<div class="empty"><h3>لا توجد قرارات موثّقة بعد</h3><p>${canManage ? 'أضف أول قرار توطين رسمي مع توثيق المصدر.' : 'سيقوم مدير النظام بإضافة القرارات الرسمية.'}</p></div>`);
    if (canManage) {
      el('addRule')?.addEventListener('click', () => openRuleForm());
      content.querySelectorAll('[data-edit-rule]').forEach((b) => b.addEventListener('click', () => openRuleForm(rules.find((x) => x.id === b.dataset.editRule))));
      content.querySelectorAll('[data-del-rule]').forEach((b) => b.addEventListener('click', async () => { if (confirm('حذف هذا القرار؟')) { await api('/api/rules/' + b.dataset.delRule, { method: 'DELETE' }); toast('تم الحذف', 'ok'); window.route(); } }));
    }

  function ruleCard(r) {
    const st = { active: ['b-ok', 'مفعّل'], upcoming: ['b-watch', 'قادم'], expired: ['b-muted', 'منتهٍ'] }[r.status] || ['b-muted', r.status];
    return `<div class="panel"><div class="panel-head"><h3>${fmt.esc(r.name || 'قرار بدون اسم')}</h3><span class="badge ${st[0]}">${st[1]}</span></div><div class="panel-body">
      <div class="info-grid">
        ${infoCell('النسبة الرسمية', r.required_pct != null ? fmt.pct(r.required_pct, 0) : null)}
        ${infoCell('النشاط الاقتصادي', r.activity)}
        ${infoCell('تاريخ الإصدار', fmt.date(r.issue_date))}
        ${infoCell('بداية التطبيق', fmt.date(r.effective_date))}
        ${infoCell('الحد الأدنى للأجور', r.min_wage != null ? fmt.moneyPlain(r.min_wage) : null)}
        ${infoCell('عدد العاملين المشمول', r.min_workers)}
