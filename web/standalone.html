      ${r.conditions ? `<div style="margin-top:8px;font-size:12.5px"><b>الشروط:</b> ${fmt.esc(r.conditions)}</div>` : ''}
      ${r.exceptions ? `<div style="margin-top:4px;font-size:12.5px"><b>الاستثناءات:</b> ${fmt.esc(r.exceptions)}</div>` : ''}
      <div style="margin-top:10px;font-size:12px;color:var(--muted)">المصدر: ${fmt.esc(r.source || '—')} ${r.source_url ? `· <a href="${fmt.esc(r.source_url)}" target="_blank" rel="noopener" style="color:var(--teal-700);font-weight:700">رابط المصدر ↗</a>` : ''}</div>
      ${can('manage_localization_rules') ? `<div class="no-print" style="margin-top:12px;display:flex;gap:8px"><button class="btn" data-edit-rule="${r.id}">تعديل</button><button class="btn" style="color:var(--danger)" data-del-rule="${r.id}">حذف</button></div>` : ''}
    </div></div>`;
  }
  function openRuleForm(rule) {
    const r = rule || {};
    const positions = (App.state.options && App.state.options.position) || [];
    const m = modal(`<div class="modal-head"><h3>${rule ? 'تعديل قرار' : 'إضافة قرار توطين'}</h3><button class="modal-close">✕</button></div><div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>اسم القرار</label><input id="rName" value="${fmt.esc(r.name || '')}"></div>
        <div class="field"><label>النسبة الرسمية (%)</label><input id="rPct" type="number" step="0.01" value="${r.required_pct ?? ''}"></div>
        <div class="field"><label>النشاط الاقتصادي</label><input id="rAct" value="${fmt.esc(r.activity || '')}"></div>
        <div class="field"><label>الحالة</label><select id="rStatus"><option value="active" ${r.status === 'active' ? 'selected' : ''}>مفعّل</option><option value="upcoming" ${r.status === 'upcoming' || !r.status ? 'selected' : ''}>قادم</option><option value="expired" ${r.status === 'expired' ? 'selected' : ''}>منتهٍ</option></select></div>
        <div class="field"><label>تاريخ الإصدار</label><input id="rIssue" type="date" value="${r.issue_date || ''}"></div>
        <div class="field"><label>بداية التطبيق</label><input id="rEff" type="date" value="${r.effective_date || ''}"></div>
        <div class="field"><label>الحد الأدنى للأجور (SAR)</label><input id="rWage" type="number" value="${r.min_wage ?? ''}"></div>
        <div class="field"><label>عدد العاملين المشمول</label><input id="rWorkers" type="number" value="${r.min_workers ?? ''}"></div>
        <div class="field"><label>منطقة التطبيق</label><input id="rRegion" value="${fmt.esc(r.region || '')}"></div>
        <div class="field"><label>تاريخ آخر تحقّق</label><input id="rVerified" type="date" value="${r.last_verified || ''}"></div>
      </div>
      <div class="field"><label>المهن المشمولة (اختر من مسميات النظام)</label><select id="rOcc" multiple size="5" style="height:auto">${positions.map((p) => `<option ${(r.occupations || []).includes(p) ? 'selected' : ''}>${fmt.esc(p)}</option>`).join('')}</select></div>
      <div class="field"><label>الشروط</label><textarea id="rCond" rows="2">${fmt.esc(r.conditions || '')}</textarea></div>
      <div class="field"><label>الاستثناءات</label><textarea id="rExc" rows="2">${fmt.esc(r.exceptions || '')}</textarea></div>
      <div class="form-grid"><div class="field"><label>المصدر (الجهة)</label><input id="rSource" value="${fmt.esc(r.source || '')}"></div><div class="field"><label>رابط المصدر الرسمي</label><input id="rUrl" type="url" value="${fmt.esc(r.source_url || '')}"></div></div>
    </div><div class="modal-foot"><button class="btn modal-close">إلغاء</button><button class="btn btn-primary" id="rSave">حفظ</button></div>`);
    el('rSave').addEventListener('click', async () => {
      const body = {
        name: el('rName').value.trim(), required_pct: el('rPct').value === '' ? null : +el('rPct').value,
        activity: el('rAct').value.trim(), status: el('rStatus').value,
        issue_date: el('rIssue').value || null, effective_date: el('rEff').value || null,
        min_wage: el('rWage').value === '' ? null : +el('rWage').value, min_workers: el('rWorkers').value === '' ? null : +el('rWorkers').value,
        region: el('rRegion').value.trim(), last_verified: el('rVerified').value || null,
        occupations: [...el('rOcc').selectedOptions].map((o) => o.value),
        conditions: el('rCond').value.trim(), exceptions: el('rExc').value.trim(),
        source: el('rSource').value.trim(), source_url: el('rUrl').value.trim(),
      };
      if (!body.name) { toast('اسم القرار مطلوب', 'err'); return; }
      if (body.status === 'active' && (body.required_pct == null || !body.source_url)) { toast('القرار المفعّل يتطلب نسبة رسمية ورابط مصدر موثّق', 'err'); return; }
      if (rule) await api('/api/rules/' + rule.id, { method: 'PUT', body: JSON.stringify(body) });
      else await api('/api/rules', { method: 'POST', body: JSON.stringify(body) });
      m.close(); toast('تم حفظ القرار', 'ok'); window.route();
    });
  }

  // ========== HISTORY ==========
  Pages.history = async function (content) {
    const r = await api('/api/uploads');
    const ups = r.uploads || [];
    content.innerHTML = head('سجل رفع البيانات', `${fmt.n(ups.length)} ملف`, printBtn()) +
      (ups.length ? `<div class="panel"><div class="panel-body tbl-wrap"><table class="tbl responsive-cards"><thead><tr><th>الفترة</th><th>الملف</th><th>تاريخ الرفع</th><th>بواسطة</th><th>الموظفون</th><th>السعودة</th>${can('view_salary') ? '<th>الرواتب</th>' : ''}<th>جودة البيانات</th><th>الحالة</th><th></th></tr></thead><tbody>
      ${ups.map((s) => `<tr><td data-l="الفترة"><b>${fmt.esc(s.periodLabel || s.period)}</b> ${s.active ? '<span class="badge b-ok">نشط</span>' : ''}</td><td data-l="الملف" style="color:var(--muted)">${fmt.esc(s.fileName)}</td><td data-l="الرفع">${new Date(s.uploadedAt).toLocaleString('ar-EG')}</td><td data-l="بواسطة">${fmt.esc(s.uploadedBy)}</td><td data-l="الموظفون" class="num">${fmt.n(s.employeeCount)}</td><td data-l="السعودة" class="num">${fmt.pct(s.saudiPct)}</td>${can('view_salary') ? `<td data-l="الرواتب" class="num">${fmt.moneyPlain(s.payroll)}</td>` : ''}<td data-l="الجودة"><span class="badge ${s.qualityScore >= 90 ? 'b-ok' : s.qualityScore >= 75 ? 'b-warn' : 'b-danger'}">${fmt.pct(s.qualityScore, 1)}</span></td><td data-l="الحالة"><span class="badge b-teal">معتمد</span></td><td class="no-print">${!s.active ? `<button class="btn" style="padding:5px 10px" data-activate="${s.id}">تفعيل</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div></div>` : emptyState());
    content.querySelectorAll('[data-activate]').forEach((b) => b.addEventListener('click', async () => { await api('/api/uploads/' + b.dataset.activate + '/activate', { method: 'POST' }); await App.loadState(); toast('تم التفعيل', 'ok'); window.route(); }));
  };

  // ========== AUDIT ==========
  Pages.audit = async function (content) {
    const r = await api('/api/audit');
    const log = r.audit || [];
    const labels = { login: 'تسجيل دخول', logout: 'خروج', login_failed: 'دخول فاشل', login_locked: 'قفل الدخول', file_uploaded: 'رفع ملف', data_committed: 'اعتماد بيانات', movement_classified: 'تصنيف حركة', leaver_reason_set: 'سبب مغادرة', rule_created: 'إنشاء قرار', rule_updated: 'تعديل قرار', rule_deleted: 'حذف قرار', user_created: 'إنشاء مستخدم', user_updated: 'تعديل مستخدم', snapshot_activated: 'تفعيل فترة', snapshot_deleted: 'حذف فترة' };
    content.innerHTML = head('سجل التدقيق', 'كل عملية مسجّلة بالمستخدم والوقت', printBtn()) +
      `<div class="panel"><div class="panel-body tbl-wrap"><table class="tbl responsive-cards"><thead><tr><th>الوقت</th><th>العملية</th><th>المستخدم</th><th>التفاصيل</th><th>IP</th></tr></thead><tbody>
      ${log.map((a) => `<tr><td data-l="الوقت">${new Date(a.at).toLocaleString('ar-EG')}</td><td data-l="العملية"><span class="badge ${a.action.includes('failed') || a.action.includes('locked') || a.action.includes('deleted') ? 'b-danger' : a.action.includes('login') ? 'b-ok' : 'b-teal'}">${labels[a.action] || a.action}</span></td><td data-l="المستخدم">${fmt.esc(a.actor || '—')}</td><td data-l="التفاصيل">${fmt.esc(a.detail || '')}</td><td data-l="IP" style="color:var(--muted);font-size:11px">${fmt.esc(a.ip || '')}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  };

  // ========== USERS ==========
  Pages.users = async function (content) {
    const r = await api('/api/users');
    const users = r.users || [];
    content.innerHTML = head('المستخدمون والصلاحيات', 'إدارة الأدوار — الرواتب مقيّدة بصلاحية خاصة', `<button class="btn btn-primary" id="addUser">+ مستخدم جديد</button>`) +
      `<div class="panel"><div class="panel-body tbl-wrap"><table class="tbl responsive-cards"><thead><tr><th>المستخدم</th><th>الاسم</th><th>الدور</th><th>الحالة</th><th></th></tr></thead><tbody>
      ${users.map((u) => `<tr><td data-l="المستخدم"><b>${fmt.esc(u.username)}</b></td><td data-l="الاسم">${fmt.esc(u.name)}</td><td data-l="الدور"><span class="badge b-teal">${fmt.esc((u.roleLabel || u.role))}</span></td><td data-l="الحالة"><span class="badge b-ok">نشط</span></td><td class="no-print"><button class="btn" style="padding:5px 10px" data-edit-user='${JSON.stringify(u).replace(/'/g, "&#39;")}'>تعديل</button></td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="panel" style="margin-top:16px"><div class="panel-head"><h3>مصفوفة الأدوار</h3></div><div class="panel-body">
        <div class="info-grid">
          ${roleInfo('Admin', 'صلاحية كاملة على النظام')}
          ${roleInfo('HR Manager', 'الموارد البشرية + الرواتب + التقارير')}
          ${roleInfo('HR Officer', 'بيانات الموظفين + الإجازات + الانتهاء (بدون رواتب)')}
          ${roleInfo('Department Manager', 'القسم فقط')}
          ${roleInfo('Viewer', 'لوحة القيادة فقط')}
        </div></div></div>`;
    el('addUser').addEventListener('click', () => openUserForm(r.roles));
    content.querySelectorAll('[data-edit-user]').forEach((b) => b.addEventListener('click', () => openUserForm(r.roles, JSON.parse(b.dataset.editUser))));
  };
  function roleInfo(name, desc) { return `<div class="info-cell"><div class="l">${name}</div><div class="v" style="font-size:12.5px;font-weight:600">${desc}</div></div>`; }
  function openUserForm(roles, user) {
    const u = user || {};
    const opts = Object.entries(roles).map(([k, v]) => `<option value="${k}" ${u.role === k ? 'selected' : ''}>${fmt.esc(v.label)}</option>`).join('');
    const m = modal(`<div class="modal-head"><h3>${user ? 'تعديل مستخدم' : 'مستخدم جديد'}</h3><button class="modal-close">✕</button></div><div class="modal-body">
      <div class="field"><label>اسم المستخدم</label><input id="uName" value="${fmt.esc(u.username || '')}" ${user ? 'disabled' : ''}></div>
      <div class="field"><label>الاسم الكامل</label><input id="uFull" value="${fmt.esc(u.name || '')}"></div>
      <div class="field"><label>الدور / الصلاحية</label><select id="uRole">${opts}</select></div>
      <div class="field"><label>رمز الدخول ${user ? '(اتركه فارغاً لعدم التغيير)' : ''}</label><input id="uPass" type="password" placeholder="••••••"></div>
    </div><div class="modal-foot"><button class="btn modal-close">إلغاء</button><button class="btn btn-primary" id="uSave">حفظ</button></div>`, { sm: true });
    el('uSave').addEventListener('click', async () => {
      try {
        if (user) { const body = { name: el('uFull').value.trim(), role: el('uRole').value }; if (el('uPass').value) body.passcode = el('uPass').value; await api('/api/users/' + u.id, { method: 'PUT', body: JSON.stringify(body) }); }
        else { if (!el('uName').value.trim() || !el('uPass').value) { toast('اسم المستخدم ورمز الدخول مطلوبان', 'err'); return; } await api('/api/users', { method: 'POST', body: JSON.stringify({ username: el('uName').value.trim(), name: el('uFull').value.trim(), role: el('uRole').value, passcode: el('uPass').value }) }); }
        m.close(); toast('تم الحفظ', 'ok'); window.route();
      } catch (e) { toast(e.body?.error || 'خطأ', 'err'); }
    });
  }

})();
</script>
<script>/* app.js — core controller: auth, routing, layout, filters, search, print. */
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  document.getElementById('yr').textContent = new Date().getFullYear();

  const App = {
    me: null, state: null, filters: {}, currentRoute: null,
  };
  window.App = App;

  // ---------- API ----------
  async function api(path, opts = {}) {
    const r = await window.clientApi(path, opts);
    if (r.status === 401) { showLogin(); throw new Error('unauthenticated'); }
    if (r.status >= 400) throw Object.assign(new Error((r.body && r.body.error) || 'error'), { status: r.status, body: r.body });
    return r.body;
  }
  function qs(extra = {}) {
    const f = Object.assign({}, App.filters, extra);
    const p = new URLSearchParams();
    Object.entries(f).forEach(([k, v]) => { if (v) p.set(k, v); });
    const s = p.toString();
    return s ? '?' + s : '';
  }
  App.api = api; App.qs = qs;

  // ---------- Formatting ----------
  const fmt = {
    n: (v, d = 0) => (v == null || isNaN(v)) ? '—' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }),
    money: (v) => (v == null || isNaN(v)) ? '—' : Number(Math.round(v)).toLocaleString('en-US') + ' <span class="cur">SAR</span>',
    moneyPlain: (v) => (v == null || isNaN(v)) ? '—' : Number(Math.round(v)).toLocaleString('en-US') + ' SAR',
    pct: (v, d = 2) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d) + '%',
    days: (v) => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(2) + ' يوم',
    date: (iso) => { if (!iso) return '—'; const d = new Date(iso + 'T00:00:00'); if (isNaN(d)) return iso; return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`; },
    esc: (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  };
  window.fmt = fmt;

  function toast(msg, kind = '') {
    const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
    $('#toasts').appendChild(t); setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3400);
  }
  window.toast = toast;

  // ---------- Modal ----------
  function modal(html, opts = {}) {
    const root = $('#modalRoot');
    root.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal ${opts.sm ? 'sm' : ''}">${html}</div></div>`;
    const close = () => { root.innerHTML = ''; };
    $('#mbg').addEventListener('click', (e) => { if (e.target.id === 'mbg' && opts.dismiss !== false) close(); });
    $$('.modal-close', root).forEach((b) => b.addEventListener('click', close));
    return { close, root };
  }
  window.modal = modal;

  // ---------- Nav definition ----------
  const NAV = [
    { group: 'الرئيسية', items: [
      { id: 'dashboard', label: 'لوحة القيادة التنفيذية', perm: 'view_dashboard', ico: '📊' },
      { id: 'insights', label: 'رؤى الذكاء الاصطناعي', perm: 'view_insights', ico: '🤖' },
    ]},
    { group: 'تحليلات القوى العاملة', items: [
      { id: 'workforce', label: 'تحليلات القوى العاملة', perm: 'view_workforce', ico: '👥' },
      { id: 'saudization', label: 'السعودة والتوطين', perm: 'view_saudization', ico: '🇸🇦' },
      { id: 'nationality', label: 'تحليلات الجنسيات', perm: 'view_nationality', ico: '🌍' },
      { id: 'departments', label: 'تحليلات الأقسام', perm: 'view_departments', ico: '🏢' },
      { id: 'jobtitles', label: 'المسميات الوظيفية', perm: 'view_jobtitles', ico: '💼' },
    ]},
    { group: 'الموظفون والحركات', items: [
      { id: 'employees', label: 'الموظفون والبحث', perm: 'view_employees', ico: '🔎' },
      { id: 'movements', label: 'الترقيات والحركات', perm: 'view_movements', ico: '📈' },
      { id: 'monthly', label: 'الحركة الشهرية', perm: 'view_movements', ico: '🔄' },
      { id: 'compare', label: 'المقارنة الشهرية', perm: 'view_comparison', ico: '⚖️' },
    ]},
    { group: 'الرصيد والامتثال', items: [
      { id: 'leave', label: 'الإجازات والأرصدة', perm: 'view_leave', ico: '🏖️' },
      { id: 'salary', label: 'تحليلات الرواتب', perm: 'view_salary', ico: '💰' },
      { id: 'expiry', label: 'الانتهاء والامتثال', perm: 'view_expiry', ico: '⏳' },
    ]},
    { group: 'الإدارة والبيانات', items: [
      { id: 'rules', label: 'مركز قرارات التوطين', perm: 'view_saudization', ico: '⚖️' },
      { id: 'upload', label: 'رفع بيانات Excel', perm: 'upload_data', ico: '⬆️' },
      { id: 'history', label: 'سجل رفع البيانات', perm: 'view_dashboard', ico: '🗂️' },
      { id: 'audit', label: 'سجل التدقيق', perm: 'view_audit', ico: '🛡️' },
      { id: 'users', label: 'المستخدمون والصلاحيات', perm: 'manage_users', ico: '👤' },
    ]},
  ];
  function can(perm) { return App.me && App.me.permissions.includes(perm); }
  window.can = can;

  function renderNav() {
    const nav = $('#nav'); nav.innerHTML = '';
    NAV.forEach((g) => {
      const items = g.items.filter((i) => can(i.perm));
      if (!items.length) return;
      const gEl = document.createElement('div'); gEl.className = 'nav-group';
      gEl.innerHTML = `<div class="nav-group-t">${g.group}</div>`;
      items.forEach((i) => {
        const a = document.createElement('a');
        a.className = 'nav-item'; a.href = '#/' + i.id; a.dataset.route = i.id;
        a.innerHTML = `<span class="ico">${i.ico}</span><span>${i.label}</span>`;
        gEl.appendChild(a);
      });
      nav.appendChild(gEl);
    });
  }

  // ---------- Filters ----------
  const FILTER_PAGES = new Set(['dashboard', 'workforce', 'saudization', 'nationality', 'departments', 'jobtitles', 'leave', 'salary', 'expiry', 'insights']);
  function renderFilters() {
    const bar = $('#filterbar');
    if (!App.state || !App.state.hasData || !FILTER_PAGES.has(App.currentRoute)) { bar.classList.add('hide'); renderActiveFilters(); return; }
    bar.classList.remove('hide');
    const o = App.state.options || {};
    const snaps = App.state.snapshots || [];
    const sel = (key, label, list, valMap) => {
      const opts = ['<option value="">الكل</option>'].concat((list || []).map((v) => {
        const val = valMap ? v.id : v; const txt = valMap ? v.label : v;
        return `<option value="${fmt.esc(val)}" ${App.filters[key] === String(val) ? 'selected' : ''}>${fmt.esc(txt)}</option>`;
      })).join('');
      return `<div class="fl"><label>${label}</label><select data-filter="${key}">${opts}</select></div>`;
    };
    bar.innerHTML =
      sel('period', 'الفترة', snaps.map((s) => ({ id: s.id, label: s.periodLabel || s.period })), true) +
      sel('division', 'المنشأة', o.division) +
      sel('department', 'القسم', o.department) +
      sel('position', 'المسمى', o.position) +
      sel('nationality', 'الجنسية', o.nationality) +
      sel('level', 'الدرجة', o.level) +
      `<div class="fl"><label>الجنس</label><select data-filter="gender"><option value="">الكل</option><option value="male" ${App.filters.gender === 'male' ? 'selected' : ''}>ذكر</option><option value="female" ${App.filters.gender === 'female' ? 'selected' : ''}>أنثى</option></select></div>` +
      `<div class="fl"><label>الجنسية (تصنيف)</label><select data-filter="saudi"><option value="">الكل</option><option value="saudi" ${App.filters.saudi === 'saudi' ? 'selected' : ''}>سعودي</option><option value="non_saudi" ${App.filters.saudi === 'non_saudi' ? 'selected' : ''}>غير سعودي</option></select></div>` +
      `<button class="filter-reset" id="filterReset">✕ مسح الفلاتر</button>`;
    $$('#filterbar select').forEach((s) => s.addEventListener('change', () => {
      App.filters[s.dataset.filter] = s.value; renderActiveFilters(); route();
    }));
    $('#filterReset').addEventListener('click', () => { App.filters = {}; renderFilters(); renderActiveFilters(); route(); });
    renderActiveFilters();
  }
  const FILTER_LABELS = { period: 'الفترة', division: 'المنشأة', department: 'القسم', position: 'المسمى', nationality: 'الجنسية', level: 'الدرجة', gender: 'الجنس', saudi: 'التصنيف' };
  function renderActiveFilters() {
    const el = $('#activeFilters'); const active = Object.entries(App.filters).filter(([k, v]) => v && k !== 'period');
    if (!active.length || App.currentRoute === 'upload') { el.innerHTML = ''; return; }
    el.innerHTML = active.map(([k, v]) => {
      let disp = v; if (k === 'period') { const s = (App.state.snapshots || []).find((x) => x.id === v); disp = s ? s.periodLabel : v; }
      if (k === 'gender') disp = v === 'male' ? 'ذكر' : 'أنثى'; if (k === 'saudi') disp = v === 'saudi' ? 'سعودي' : 'غير سعودي';
      return `<span class="af"><b>${FILTER_LABELS[k]}:</b> ${fmt.esc(disp)} <span data-clear="${k}">✕</span></span>`;
    }).join('');
    $$('#activeFilters [data-clear]').forEach((x) => x.addEventListener('click', () => { delete App.filters[x.dataset.clear]; renderFilters(); route(); }));
  }

  // ---------- Router ----------
  async function route() {
    const hash = location.hash.replace(/^#\/?/, '') || 'dashboard';
    const [page, param] = hash.split('/');
    App.currentRoute = page;
    $$('.nav-item').forEach((a) => a.classList.toggle('active', a.dataset.route === page));
    $('#sidebar').classList.remove('open'); $('.sidebar-backdrop')?.remove();
    renderFilters();
    const content = $('#content');
    if (Chart) Chart.disposeAll();
    // permission gate
    const navItem = NAV.flatMap((g) => g.items).find((i) => i.id === page);
    if (navItem && !can(navItem.perm)) { content.innerHTML = accessDenied(); return; }
    content.innerHTML = '<div class="spinner"></div>';
    try {
      if (page === 'employee') return Pages.employee(content, param);
      if (Pages[page]) return await Pages[page](content, param);
      content.innerHTML = accessDenied('الصفحة غير موجودة');
    } catch (e) {
      if (e.message === 'unauthenticated') return;
      console.error(e); content.innerHTML = `<div class="empty"><h3>تعذّر تحميل الصفحة</h3><p>${fmt.esc(e.message || '')}</p></div>`;
    }
  }
  window.route = route;
  function accessDenied(msg) { return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg><h3>${msg || 'لا تملك صلاحية الوصول'}</h3><p>يرجى التواصل مع مدير النظام لمنحك الصلاحية المناسبة.</p></div>`; }

  // ---------- Global search ----------
  let searchTimer;
  function initSearch() {
    const inp = $('#globalSearch'); const box = $('#suggest');
    inp.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const q = inp.value.trim();
      if (q.length < 1) { box.classList.add('hide'); return; }
      if (!can('view_employees')) { box.classList.add('hide'); return; }
      searchTimer = setTimeout(async () => {
        try {
          const r = await api('/api/employees?q=' + encodeURIComponent(q) + (App.filters.period ? '&period=' + App.filters.period : ''));
          if (r.empty || !r.employees.length) { box.innerHTML = '<div class="suggest-item">لا نتائج</div>'; box.classList.remove('hide'); return; }
          box.innerHTML = r.employees.slice(0, 8).map((e) => `<div class="suggest-item" data-code="${fmt.esc(e.employee_code)}"><span class="code">${fmt.esc(e.employee_code)}</span><div><div style="font-weight:700">${fmt.esc(e.arabic_name || e.name)}</div><div style="font-size:11px;color:var(--muted)">${fmt.esc(e.position || '')} · ${fmt.esc(e.section || '')}</div></div></div>`).join('') + (r.total > 8 ? `<div class="suggest-item" style="justify-content:center;color:var(--muted)">+${r.total - 8} نتيجة أخرى — اضغط Enter</div>` : '');
          box.classList.remove('hide');
          $$('.suggest-item[data-code]', box).forEach((it) => it.addEventListener('click', () => { box.classList.add('hide'); inp.value = ''; location.hash = '#/employee/' + it.dataset.code; }));
        } catch (e) {}
      }, 200);
    });
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); box.classList.add('hide'); if (can('view_employees')) location.hash = '#/employees?q=' + encodeURIComponent(inp.value.trim()); } });
    document.addEventListener('click', (e) => { if (!e.target.closest('.search-box')) box.classList.add('hide'); });
  }

  // ---------- Topbar ----------
  function initTopbar() {
    $('#menuBtn').addEventListener('click', () => {
      const sb = $('#sidebar'); sb.classList.toggle('open');
      if (sb.classList.contains('open')) { const bd = document.createElement('div'); bd.className = 'sidebar-backdrop'; bd.addEventListener('click', () => { sb.classList.remove('open'); bd.remove(); }); document.body.appendChild(bd); }
      else $('.sidebar-backdrop')?.remove();
    });
    $('#userBtn').addEventListener('click', (e) => { e.stopPropagation(); $('#userMenu').classList.toggle('hide'); });
    document.addEventListener('click', () => $('#userMenu').classList.add('hide'));
    $('#userMenu').addEventListener('click', (e) => e.stopPropagation());
    $('#miLogout').addEventListener('click', async () => { await api('/api/logout', { method: 'POST' }); location.reload(); });
    $('#miPrint').addEventListener('click', () => { $('#userMenu').classList.add('hide'); Pages.printCurrent(); });
    $('#miReport').addEventListener('click', () => { $('#userMenu').classList.add('hide'); location.hash = '#/dashboard'; setTimeout(() => Pages.printCurrent(), 400); });
    $('#periodChip').addEventListener('click', () => openPeriodPicker());
  }
  function openPeriodPicker() {
    if (!App.state || !App.state.snapshots.length) { location.hash = '#/upload'; return; }
    const snaps = App.state.snapshots.slice().reverse();
    const m = modal(`<div class="modal-head"><h3>اختيار فترة التقرير</h3><button class="modal-close">✕</button></div><div class="modal-body"><p style="color:var(--muted);margin-top:0">اختر الملف الشهري النشط لعرض تحليلاته.</p><div class="tbl-wrap"><table class="tbl clickable"><thead><tr><th>الفترة</th><th>الملف</th><th>الموظفون</th><th>السعودة</th><th>الجودة</th></tr></thead><tbody>${snaps.map((s) => `<tr data-id="${s.id}"><td><b>${fmt.esc(s.periodLabel || s.period)}</b></td><td style="color:var(--muted)">${fmt.esc(s.fileName)}</td><td class="num">${fmt.n(s.employeeCount)}</td><td class="num">${fmt.pct(s.saudiPct)}</td><td><span class="badge ${s.qualityScore >= 90 ? 'b-ok' : s.qualityScore >= 75 ? 'b-warn' : 'b-danger'}">${fmt.pct(s.qualityScore, 1)}</span></td></tr>`).join('')}</tbody></table></div></div>`, { sm: false });
    $$('tr[data-id]', m.root).forEach((tr) => tr.addEventListener('click', async () => { await api('/api/uploads/' + tr.dataset.id + '/activate', { method: 'POST' }); App.filters.period = ''; m.close(); await loadState(); location.hash = '#/dashboard'; route(); toast('تم تفعيل الفترة', 'ok'); }));
  }

  // ---------- State ----------
  async function loadState() {
    App.state = await api('/api/state');
    // topbar
    if (App.state.active) { $('#periodLabel').textContent = App.state.active.periodLabel || App.state.active.period || '—'; }
    else $('#periodLabel').textContent = 'لا توجد بيانات';
    const q = App.state.quality;
    const chip = $('#qualityChip');
    if (q) { chip.classList.remove('hide', 'mid', 'low'); if (q.score < 75) chip.classList.add('low'); else if (q.score < 90) chip.classList.add('mid'); $('#qualityVal').textContent = q.score.toFixed(1) + '%'; }
    else chip.classList.add('hide');
    $('#sideFoot').innerHTML = App.state.active ? `الفترة النشطة<br><b style="color:#fff">${fmt.esc(App.state.active.periodLabel || '')}</b>` : 'لم تُرفع بيانات بعد';
  }
  App.loadState = loadState;
  App.reload = async () => { await loadState(); renderFilters(); route(); };

  // ---------- Login ----------
  function showLogin() { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#passcode').focus(); }
  function initLogin() {
    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('#loginBtn'); const err = $('#loginErr'); err.textContent = '';
      const pass = $('#passcode').value.trim();
      if (!pass) return;
      btn.disabled = true; btn.textContent = 'جارٍ الدخول…';
      try {
        const r = await api('/api/login', { method: 'POST', body: JSON.stringify({ passcode: pass }) });
        App.me = r.user; await boot();
      } catch (ex) {
        if (ex.body && ex.body.error === 'locked') err.textContent = `تم قفل الدخول مؤقتاً لمدة ${ex.body.lockMinutes || 15} دقيقة بعد محاولات خاطئة.`;
        else err.textContent = 'رمز الدخول غير صحيح.';
        $('#passcode').value = ''; $('#passcode').focus();
      } finally { btn.disabled = false; btn.textContent = 'تسجيل الدخول'; }
    });
  }

  async function boot() {
    $('#login').classList.add('hide'); $('#app').classList.remove('hide');
    $('#userName').textContent = App.me.name; $('#userRole').textContent = (App.me.roleLabel || '').split('—')[0];
    $('#userAv').textContent = (App.me.name || 'U').trim().charAt(0).toUpperCase();
    $('#miSession').textContent = 'جلسة: ' + App.me.username + ' · تنتهي بعد خمول 30 دقيقة';
    renderNav();
    await loadState();
    if (!location.hash) location.hash = '#/dashboard';
    route();
  }

  window.addEventListener('hashchange', route);

  // ---------- Init ----------
  async function start() {
    initLogin(); initTopbar(); initSearch();
    try { const r = await api('/api/me'); App.me = r.user; await boot(); }
    catch (e) { showLogin(); }
  }
  // wait for deferred libs
  if (document.readyState === 'complete') start(); else window.addEventListener('load', start);
})();
</script>
